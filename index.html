function logoTempio(dim){
  const d = dim || 72;
  return '<img src="' + LOGO_PNG + '" width="' + d + '" height="' + d + '" alt="Olympvs" style="display:block;margin:0 auto;border-radius:' + Math.round(d * 0.18) + 'px">';
}

function vistaHome(){
  const vie = [
    {via:"auto", dio:"zeus", t:"Decidono gli dèi", d:"Rispondi a poche domande e la scheda nasce da sola, con serie, ripetizioni e recuperi già al posto giusto.", b:"Fammi la scheda"},
    {via:"manuale", dio:"atena", t:"La scrivi tu", d:"Sai già cosa fare. Aggiungi i giorni e gli esercizi uno a uno, con l'elenco che ti suggerisce i nomi.", b:"Scrivila io"},
    {via:"import", dio:"ermes", t:"Ce l'hai già", d:"Portala qui da Excel, Word, PDF o dalle note. La leggo e la riscrivo nel formato dell'app.", b:"Caricala"}
  ];
  let h = '<div class="cielo">' + cielo() +
    '<div class="cielo-testo">' + logoTempio(104) + "<h1>OLYMPVS</h1><p>Fortitudo per constantiam</p>" +
    '<div style="margin-top:18px">' + greca("rgba(201,164,76,.95)") + "</div></div></div>";
  h += '<div class="wrap"><h2 style="text-align:center">Da dove partiamo?</h2>' +
    '<p class="muted" style="text-align:center;margin-bottom:6px">Tre strade, stessa destinazione.</p>';
  vie.forEach((v, i) => {
    h += '<div class="scelta' + (i % 2 ? " destra" : "") + '" style="border-top:4px solid ' + DEI[v.dio].col + '">' +
      '<div class="figura">' + cartoon(v.dio, 84) +
      '<div class="epiteto" style="color:' + DEI[v.dio].col + ';text-align:center;font-size:11px">' + DEI[v.dio].n + "</div></div>" +
      '<div style="flex:1"><h3 style="font-family:var(--disp);font-size:18px;font-weight:700">' + v.t + "</h3>" +
      '<p class="tiny" style="margin:5px 0 10px">' + v.d + "</p>" +
      '<button class="btn small" data-via="' + v.via + '" style="background:' + DEI[v.dio].col + ';border-color:' + DEI[v.dio].col + '">' + v.b + "</button></div></div>";
  });
  h += '<div class="card" style="margin-top:18px"><h3 style="text-align:center;font-family:var(--disp);font-size:16px">Chi ti allenerà</h3>' +
    '<div class="pantheon">' + ["zeus","eracle","poseidone","atena","ermes"].map(k =>
      "<figure>" + cartoon(k, 62) + '<figcaption class="tiny" style="font-family:var(--disp);font-weight:700;color:' + DEI[k].col + '">' +
      DEI[k].n + "</figcaption></figure>").join("") + "</div>" +
    '<p class="tiny" style="text-align:center;margin-top:6px">Ogni giorno di allenamento porta il nome di una divinità: sai sempre chi affronti.</p></div>';
  if(S.profilo && S.scheda) h = h.replace('<h2 style="text-align:center">Da dove partiamo?</h2>',
    '<div class="flag info" style="margin-top:0"><div class="dot" style="background:var(--egeo)"></div><div>' +
    'Hai già una scheda attiva: <strong>' + esc(S.scheda.nome) + "</strong>. Se ne crei un\'altra questa viene sostituita, ma carichi e progressi restano." +
    '<div style="margin-top:10px"><button class="btn small" data-via="resta">Continua con questa</button></div></div></div>' +
    '<h2 style="text-align:center">Oppure ricominciamo</h2>');
  h += '<div style="text-align:center;margin-top:14px"><button class="btn link" data-via="backup">Ho un backup da ripristinare</button></div>';
  return h + "</div>";
}

function vistaImporta(){
  let h = '<div class="tempio" style="background:' + DEI.ermes.col + ';padding-bottom:0;display:flex;align-items:flex-end;gap:10px">' +
    '<div style="flex:1;padding-bottom:16px"><button class="btn link" data-via="home" style="color:#fff">← Indietro</button>' +
    '<h1>Portala qui</h1><p class="epiteto" style="color:rgba(255,255,255,.85)">Ermes, il messaggero</p></div>' +
    '<div style="flex:0 0 82px">' + cartoon("ermes", 82) + "</div></div>" +
    '<div style="background:' + DEI.ermes.col + '">' + greca("rgba(255,255,255,.8)") + "</div>";
  h += '<div class="wrap">' + cardImport() + "</div>";
  return h;
}

function vistaProfilo(nuovo){
  const p = S.profilo || {genere:"uomo", obiettivo:"ipertrofia", esperienza:"principiante", giorni:3, attrezzatura:"palestra"};
  const chip = (c, v, t) => '<button class="chip" data-campo="' + c + '" data-val="' + v + '" aria-pressed="' + (String(p[c]) === String(v)) + '">' + t + "</button>";
  return '<div class="tempio" style="' + (nuovo ? "background:" + DEI.zeus.col : "") + '">' +
    (nuovo ? '<button class="btn link" data-via="home" style="color:#fff">← Indietro</button>' +

function vistaGiorno(gi){
  const g = S.scheda.giorni[gi], dio = DEI[g.dio], scarico = inScarico();
  let h = '<div class="tempio" style="background:' + dio.col + '">' +
    '<button class="btn link" id="indietro" style="color:#fff">← Tutti gli allenamenti</button>' +
    '<div class="glifo">' + glifo(g.dio, 62, "#fff") + "</div>" +
    "<h1>" + dio.n + '</h1><p class="epiteto" style="color:rgba(255,255,255,.85)">' + dio.ep + "</p>" +
    '<p class="muted" style="color:rgba(255,255,255,.8)">' + (scarico ? "Settimana di scarico: una serie in meno, carichi al 60%." : "Scrivi peso e ripetizioni serie per serie. Si salva da solo.") +
    "</p>" + greca("rgba(255,255,255,.7)") + "</div>";
  h += '<div class="card flat" style="margin:0;border-left:0;border-right:0">';
  g.ex.forEach((e0, ei) => {
    const e = exCorrente(gi, ei), ex = EX[e.id], k = gi + ":" + ei;
    const c = consiglio(e), aperto = S.exAperto === k, bz = S.bozza[k] || [];
    const u = sessioni(e.id).slice(-1)[0], peso = carico(e.id);
    const sets = scarico ? Math.max(2, e.sets - 1) : e.sets;
    h += '<div class="ex"><div class="row"><div><h3>' + esc(ex.n) + "</h3>" +
      '<div class="tiny">' + ex.g + " · " + ex.att + (S.sostituz[k] ? " · sostituito oggi" : "") + "</div></div>" +
      '<div class="target">' + (ex.cardio ? e.rmin + "-" + e.rmax + " min" : sets + " × " + e.rmin + "-" + e.rmax + (ex.secondi ? " sec" : "")) + "</div></div>";
    if(peso > 0){
      const mostra = scarico ? Math.round(peso * 0.6 / 2.5) * 2.5 : peso;
      h += '<div class="tiny" style="margin-top:6px">' + (ex.cardio ? "Livello: " : "Carico: ") + '<strong style="color:var(--notte);font-size:14px">' + fmt(mostra) + (ex.cardio ? "" : " kg") + "</strong>" +
        (scarico ? " (scarico)" : "") + (u ? " · ultima volta " + u.sets.filter(s => s.r > 0).map(s => fmt(s.w) + (ex.cardio ? "·" : "×") + s.r).join("  ") : "") + "</div>";
      if(ex.att === "bilanciere" && mostra >= 20) h += htmlDischi(mostra);
    }
    if(c && c.tipo === "su" && !scarico){
      h += '<div class="flag su"><div class="dot" style="background:var(--alloro)"></div><div>' + esc(c.txt) +
        (c.inc ? '<div style="margin-top:9px"><button class="btn small" data-su="' + k + '">Sali a ' + fmt(peso + c.inc) + " kg</button></div>" : "") + "</div></div>";
    } else if(c && c.tipo === "giu"){
      h += '<div class="flag giu"><div class="dot" style="background:var(--oro)"></div><div>' + esc(c.txt) + "</div></div>";
    } else if(c){
      h += '<div class="tiny" style="margin-top:6px">' + esc(c.txt) + "</div>";
    }
    h += '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn ghost small" data-apri="' + k + '">' + (aperto ? "Chiudi" : "Registra le serie") + "</button>" +
      (S.video[e.id] && S.video[e.id].tipo === "yt"
        ? '<a class="btn ghost small" style="text-decoration:none;display:inline-block" href="https://www.youtube.com/watch?v=' +
          S.video[e.id].id + '" target="_blank" rel="noopener">Apri su YouTube</a>'
        : '<a class="btn ghost small" style="text-decoration:none;display:inline-block" href="' + cercaVideo(e.id) +
          '" target="_blank" rel="noopener">Cerca su YouTube</a>') +
      '<button class="btn ghost small" data-video="' + k + '">' + (S.videoAperto === k ? "Chiudi" : "Come si fa") + "</button>" +
      '<button class="btn ghost small" data-scambia="' + k + '">Attrezzo occupato</button></div>';
    if(S.videoAperto === k) h += pannelloVideo(e.id);
    if(S.scambiaPer === k){
      const usati = {}; g.ex.forEach((x, j) => usati[exCorrente(gi, j).id] = j !== ei);
      const opzioni = Object.keys(EX).filter(id => EX[id].g === ex.g && id !== e.id && adatto(id, S.profilo) && !usati[id]).slice(0, 4);
      h += '<div class="flag info"><div class="dot" style="background:var(--egeo)"></div><div>Stesso gruppo muscolare, scegli il ricambio:' +
        opzioni.map(id => '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
          '<strong style="flex:1 1 100%;font-size:14px">' + esc(EX[id].n) + "</strong>" +
          '<button class="btn small" data-usa="' + k + "|" + id + '">Solo oggi</button>' +
          '<button class="btn ghost small" data-usasempre="' + k + "|" + id + '">Sempre</button></div>').join("") +
        (opzioni.length ? "" : "<div class=\"tiny\" style=\"margin-top:6px\">Nessuna alternativa libera per questo gruppo.</div>") +
        '<div style="margin-top:10px"><button class="btn link" data-scambia="' + k + '">Annulla</button></div></div></div>';
    }
    if(aperto){
      h += '<div style="margin-top:12px;border-top:1px dotted var(--linea);padding-top:11px">';
      const w = riscaldamento(e);
      if(w && !scarico) h += '<div class="warm"><b>Riscaldamento</b><div style="margin-top:4px">' +
        w.map((x, i) => (i + 1) + ") " + fmt(x.kg) + " kg × " + x.r).join(" &nbsp;·&nbsp; ") +
        '</div><div class="tiny" style="margin-top:4px">Poi le serie vere. Recupero breve, 60 secondi.</div></div>';
      h += '<h3 style="margin-top:12px">Tecnica</h3><ul style="margin:6px 0 12px;padding-left:18px;font-size:14px">' +
        ex.cue.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul>";
      for(let i = 0; i < sets; i++){
        const v = bz[i] || {}, pieno = v.w !== undefined && v.w !== "" && v.r;
        h += '<div class="setline' + (pieno ? " done" : "") + '"><div class="i">' + (i + 1) + "</div>" +
          '<input type="number" inputmode="decimal" step="0.5" placeholder="' + (ex.cardio ? "livello" : peso > 0 ? fmt(peso) : "kg") + '" value="' + esc(v.w) + '" data-set="' + k + ":" + i + ':w"><div class="x">' + (ex.cardio ? "·" : "×") + "</div>" +
          '<input type="number" inputmode="numeric" placeholder="' + (ex.cardio ? "min" : ex.secondi ? "sec" : "rip") + '" value="' + esc(v.r) + '" data-set="' + k + ":" + i + ':r"><div class="ok">' + (pieno ? "✓" : "") + "</div></div>";
      }
      h += '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
        '<button class="btn small" data-salvaex="' + k + '">Salva l\'esercizio</button>' +
        '<button class="btn ghost small" data-timer="' + e.rest + '">Recupero ' + Math.round(e.rest / 60 * 10) / 10 + " min</button></div></div>";
    }
    h += "</div>";
  });
  h += '</div><div class="wrap"><button class="btn oro" id="chiudi-sessione">Ho finito</button></div>';
  return h;
}

const MIS = [["vita","Vita"],["torace","Torace"],["braccio","Braccio"],["coscia","Coscia"],["fianchi","Fianchi"]];

function vistaProgressi(){
  const s = S.subProgressi;
  let h = '<div class="tempio"><h1>Progressi</h1><p class="muted">Il peso mente da solo. Guardalo insieme a misure e foto.</p>' + greca() + "</div><div class=\"wrap\">";
  h += '<div class="seg">' + [["peso","Peso"],["misure","Misure"],["foto","Foto"],["carichi","Carichi"],["mis","Misuratori"]].map(([k, t]) =>
    '<button data-sub="' + k + '" aria-pressed="' + (s === k) + '">' + t + "</button>").join("") + "</div>";

  if(s === "peso"){
    const w = S.pesi.slice().sort((a, b) => a.ts - b.ts);
    h += '<div class="card"><h2>Peso corporeo</h2><div class="filo"></div>';
    h += w.length >= 2 ? grafico(w.map(x => x.kg), w) :
      '<p class="muted">Pesati una volta a settimana, sempre lo stesso giorno appena sveglio. Dopo due misurazioni compare la linea.</p>';
    h += '<label for="f-peso-new">Peso di oggi in kg</label><div style="display:flex;gap:8px">' +
      '<input id="f-peso-new" type="number" inputmode="decimal" step="0.1" placeholder="76,5">' +
      '<button class="btn small" id="add-peso">Aggiungi</button></div>';
    h += w.slice(-6).reverse().map(x => '<div class="hist"><span>' + dataIt(x.ts) + "</span><strong>" + fmt(x.kg) + " kg</strong></div>").join("");
    h += "</div>";
  }

  if(s === "misure"){
    const u = S.misure.slice(-1)[0], pr = S.misure[0];
    h += '<div class="card"><h2>Misure in cm</h2><div class="filo"></div>' +
      '<p class="muted">Misura a freddo, sempre nello stesso punto. Braccio contratto, vita all\'ombelico.</p>';
    if(u) h += MIS.filter(([k]) => u[k]).map(([k, t]) => {
      const d = pr && pr[k] ? u[k] - pr[k] : 0;
      return '<div class="hist"><span>' + t + "</span><strong>" + fmt(u[k]) + " cm" +
        (d ? ' <span style="color:var(--egeo);font-weight:400">(' + (d > 0 ? "+" : "") + fmt(d) + ")</span>" : "") + "</strong></div>";
    }).join("");
    h += '<div class="grid2">' + MIS.map(([k, t]) =>
      '<div><label for="m-' + k + '">' + t + '</label><input id="m-' + k + '" type="number" inputmode="decimal" step="0.5" placeholder="' + (u && u[k] ? fmt(u[k]) : "") + '"></div>').join("") + "</div>" +
      '<div style="height:14px"></div><button class="btn" id="add-misure">Salva le misure di oggi</button>' +
      '<p class="tiny" style="margin-top:8px">' + (S.misure.length ? S.misure.length + " rilevazioni salvate, la prima il " + dataIt(S.misure[0].ts) : "Nessuna rilevazione ancora.") + "</p></div>";
  }

  if(s === "foto"){
    h += '<div class="card"><h2>Foto</h2><div class="filo"></div>' +
      '<p class="muted">Stessa posizione, stessa luce, stessa ora. Una ogni quattro settimane basta. Restano solo su questo dispositivo.</p>' +
      '<div style="height:12px"></div><input id="scatta" type="file" accept="image/*" capture="environment">';
    h += S.foto.length ? '<div class="foto">' + S.foto.slice().reverse().map(f =>
      '<figure><img data-src="' + f.key + '" alt="Foto del ' + dataIt(f.ts) + '"><button data-delfoto="' + f.key + '" aria-label="Elimina">×</button>' +
      "<figcaption>" + dataIt(f.ts) + "</figcaption></figure>").join("") + "</div>" :
      '<p class="tiny" style="margin-top:10px">Ancora nessuna foto.</p>';
    h += "</div>";
  }

  if(s === "mis"){
    const m = misuratori(14);
    h += '<div class="card"><h2>Ultimi 14 giorni</h2><div class="filo"></div>' + barreMisuratori(m) + "</div>";
    h += '<div class="card"><h2>Cosa ti consiglio</h2><div class="filo"></div><ul class="cambi">' +
      consigliMisuratori(m).map(c => '<li class="' + (c.t === "bene" ? "piu" : c.t === "attenzione" ? "meno" : "neutro") +
        '">' + esc(c.txt) + "</li>").join("") + "</ul>" +
      '<p class="tiny" style="margin-top:10px">Te li ripropongo da solo ogni quindici giorni. La revisione della scheda arriva una volta al mese.</p>' +
      '<div style="height:12px"></div><button class="btn ghost" id="rev-ora">Rivedi la scheda adesso</button></div>';
  }
  if(s === "carichi"){
    h += '<div class="card"><h2>Record personali</h2><div class="filo"></div>';
    const ids = Array.from(new Set(S.log.map(l => l.exId)));
    if(!ids.length) h += '<p class="muted">Registra il primo allenamento: qui compariranno i carichi migliori.</p>';
    ids.forEach(id => {
      let best = 0, r = 0;
      sessioni(id).forEach(l => l.sets.forEach(x => { if(x.w > best){ best = x.w; r = x.r; } }));
      if(best > 0) h += '<div class="hist"><span>' + esc(EX[id].n) + "</span><strong>" + fmt(best) + " kg × " + r + "</strong></div>";
    });
    h += "</div>";
    const sett = {};
    S.log.forEach(l => {
      const k = Math.floor(l.ts / 6048e5);
      sett[k] = (sett[k] || 0) + l.sets.reduce((a, x) => a + (x.w || 0) * (x.r || 0), 0);
    });
    const kk = Object.keys(sett).sort().slice(-6);
    if(kk.length >= 2){
      const mx = Math.max.apply(null, kk.map(k => sett[k]));
      h += '<div class="card"><h2>Lavoro settimanale</h2><div class="filo"></div>' +
        '<p class="tiny">Peso per ripetizioni, sommato su tutte le serie. Se il numero sale, stai progredendo.</p>' +
        kk.map((k, i) => '<div style="margin-top:10px"><div class="tiny">Settimana ' + (i + 1) + " · " + Math.round(sett[k]) + " kg</div>" +
          '<div style="height:9px;background:var(--egeo);width:' + Math.max(3, sett[k] / mx * 100) + '%"></div></div>').join("") + "</div>";
    }
  }
  return h + "</div>";
}

function grafico(vals, righe){
  const min = Math.min.apply(null, vals) - 1, max = Math.max.apply(null, vals) + 1;
  const W = 300, H = 130;
  const pts = vals.map((v, i) => [12 + i * (W - 24) / (vals.length - 1), H - 14 - (v - min) / (max - min || 1) * (H - 34)]);
  const d = vals[vals.length - 1] - vals[0];
  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Andamento">' +
    '<line x1="0" y1="' + (H - 10) + '" x2="' + W + '" y2="' + (H - 10) + '" stroke="var(--linea)"/>' +
    '<polyline fill="none" stroke="var(--egeo)" stroke-width="2.5" stroke-linejoin="round" points="' +
    pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ") + '"/>' +
    pts.map(p => '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="var(--egeo)"/>').join("") + "</svg>" +
    '<div class="row"><div class="tiny">' + dataIt(righe[0].ts) + " → " + dataIt(righe[righe.length - 1].ts) + "</div>" +
    '<div class="num" style="font-size:18px;color:var(--egeo)">' + (d > 0 ? "+" : "") + fmt(d) + " kg</div></div>";
}

function avvisa(txt){ S.toast = txt; render(); }
function render(){
  let h;
  if(S.bozzaScheda) h = vistaConferma();
  else if(S.avvio === "auto") h = vistaProfilo(true);
  else if(S.avvio === "import") h = vistaImporta();
  else if(S.avvio === "home" || !S.profilo || !S.scheda) h = vistaHome();
  else if(S.tab === "oggi") h = vistaOggi();
  else if(S.tab === "progressi") h = vistaProgressi();
  else h = vistaProfilo(false);
  if(S.profilo && S.scheda && !S.bozzaScheda && !S.avvio){
    if(S.timer) h += '<div class="timer"><div><div class="tiny" style="color:#9FAAB3">Recupero</div>' +
      '<div class="num" id="tick">' + mmss(S.timer.left) + "</div></div>" +
      '<div style="display:flex;gap:8px"><button data-timeradd="30">+30 s</button><button data-timerstop="1">Chiudi</button></div></div>';
    h += '<nav class="nav">' + [["oggi","Allenamento"],["progressi","Progressi"],["profilo","Profilo"]].map(([k, t]) =>
      '<button data-tab="' + k + '" aria-current="' + (S.tab === k) + '"><span class="ic">' + ICONE[k] + "</span>" + t + "</button>").join("") + "</nav>";
  }
  if(S.modale === "proposta") h += modaleProposta();
  else if(S.modale === "conferma") h += modaleConferma();
  else if(S.modale === "check") h += modaleCheck();
  if(S.toast){ h = '<div class="toast" id="toast" role="status">' + esc(S.toast) + "</div>" + h; S.toast = null; }
  $("#app").innerHTML = h;
  const tt = $("#toast");
  if(tt) setTimeout(() => { try{ tt.remove(); }catch(e){} }, 4500);
  tavoleEsercizi();
  caricaFoto();
  window.scrollTo(0, S.scroll || 0); S.scroll = 0;
}
const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function tavoleEsercizi(){
  document.querySelectorAll("img.tavola-img").forEach(im => {
    const dis = im.parentNode.querySelector(".tavola-dis");
    im.onload = () => { im.style.display = "block"; };
    im.onerror = () => { im.style.display = "none"; if(dis) dis.style.display = ""; };
    if(im.complete){ if(im.naturalWidth > 0) im.style.display = "block"; else { if(dis) dis.style.display = ""; } }
  });
}

async function caricaFoto(){
  for(const im of document.querySelectorAll("img[data-src]")){
    try{ const r = await store.get(im.dataset.src); if(r && r.value) im.src = r.value; }
    catch(e){ im.alt = "Foto non caricata"; }
  }
  for(const vd of document.querySelectorAll("video[data-vsrc]")){
    try{ const r = await store.get(vd.dataset.vsrc); if(r && r.value) vd.src = r.value; }
    catch(e){}
  }
}

  }
  if(el.id === "impfile" && el.files && el.files[0]){
    const f = el.files[0]; el.value = "";
    const st = $("#stato-import");
    if(st) st.textContent = "Leggo " + f.name + "…";
    if(/\.json$/i.test(f.name)){
      try{
        const dati = JSON.parse(await f.text());
        if(!dati.profilo && !dati.scheda) throw 0;
        Object.assign(S, dati); if(S.exCustom) Object.assign(EX, S.exCustom);
        await salva(); S.avvio = null; S.tab = "oggi"; S.msg = "Backup ripristinato.";
        render();
      }catch(e){ if(st) st.textContent = "Il file non sembra un backup dell'app."; }
      return;
    }
    try{
      const txt = await testoDaFile(f);
      const r = analizza(txt);
      if(!r.giorni.length){
        if(st) st.textContent = "Ho aperto il file ma non ho trovato esercizi riconoscibili. Prova a incollare il testo qui sotto.";
        return;
      }
      S.bozzaScheda = {giorni:r.giorni};
      S.importInfo = {nome:f.name, lette:r.lette};
      render();
    }catch(e){
      if(st) st.textContent = (e && e.message && e.message !== "rete") ? e.message :
        "Non sono riuscito ad aprire il file: se non c'è rete non posso leggere Excel, Word e PDF. Copia il testo e incollalo qui sotto.";
    }
    return;
  }
  if(el.classList.contains("vfile") && el.files && el.files[0]){
    const f = el.files[0], exId = el.dataset.ex; el.value = "";
    if(f.size > 3.2 * 1024 * 1024){
      avvisa("Video troppo pesante (" + Math.round(f.size / 104857.6) / 10 + " MB). Serve sotto i 3 MB: taglialo a dieci o quindici secondi, bastano.");
      return;
    }
    const fr = new FileReader();
    fr.onload = async () => {
      const key = "olympvs:video:" + exId;
      try{
        await store.set(key, fr.result);
        const v = S.video[exId];
        if(v && v.tipo === "locale" && v.key !== key){ try{ await store.delete(v.key); }catch(e){} }
        S.video[exId] = {tipo:"locale", key};
        await salva();
      }catch(e){ avvisa("Non sono riuscito a salvare il video: prova con uno più corto."); }
      S.scroll = window.scrollY; render();
    };
    fr.readAsDataURL(f);
    return;
  }
  if(el.id === "import" && el.files && el.files[0]){
    const f = el.files[0]; el.value = "";
    try{
      const testo = await f.text(), dati = JSON.parse(testo);
      if(!dati.profilo) throw 0;
      Object.assign(S, dati); await salva();
      S.tab = "oggi"; S.msg = "Backup ripristinato."; render();
    }catch(e){ avvisa("Il file non sembra un backup dell'app."); }
  }
});

document.addEventListener("change", function(ev){
  if(ev.target.type === "file") ev.target.dispatchEvent(new Event("input", {bubbles:true}));
});

function aggiungiFoto(file){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = async () => {
        const max = 760, s = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
        cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
        const key = "olympvs:foto:" + Date.now();
        try{
          await store.set(key, cv.toDataURL("image/jpeg", 0.62));
          S.foto.push({ts:Date.now(), key}); await salva();
        }catch(e){ avvisa("Non sono riuscito a salvare la foto."); }
        render(); res();
      };
      im.onerror = () => { avvisa("Immagine non leggibile."); res(); };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function leggiForm(p){
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  if(!document.getElementById("f-nome")) return;
  p.nome = g("f-nome");
  p.eta = Number(g("f-eta")) || p.eta;
  p.altezza = Number(g("f-alt")) || p.altezza;
  p.peso = Number(g("f-peso").replace(",", ".")) || p.peso;
  p.note = g("f-note");
}

/* timer */
let intv = null;
function avviaTimer(sec){
  S.timer = {left:sec}; clearInterval(intv);
  intv = setInterval(() => {
    if(!S.timer) return clearInterval(intv);
    S.timer.left--;
    if(S.timer.left <= 0){
      clearInterval(intv);
      if(navigator.vibrate) navigator.vibrate([200, 100, 200]);
      S.timer = null; render(); return;
    }
    tick();
  }, 1000);
  render();
}
function tick(){ const el = $("#tick"); if(el && S.timer) el.textContent = mmss(S.timer.left); }
function stopTimer(){ clearInterval(intv); S.timer = null; }

/* avvisi mentre l'app è aperta */
let avviso = null;
function pianificaAvvisi(){
  clearTimeout(avviso);
  if(!S.promemoria.attivo || typeof Notification === "undefined" || Notification.permission !== "granted") return;
  const [h, m] = S.promemoria.ora.split(":").map(Number);
  const ora = new Date(), t = new Date();
  t.setHours(h, m, 0, 0);
  if(t <= ora) t.setDate(t.getDate() + 1);
  if(S.promemoria.giorni.indexOf(t.getDay()) < 0) return;
  const ms = t - ora;
  if(ms < 2147483647) avviso = setTimeout(() => {
    try{ new Notification("È l'ora dell'allenamento", {body:"Il tempio ti aspetta, guerriero."}); }catch(e){}
    pianificaAvvisi();
  }, ms);
}
