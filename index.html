function avvisa(txt){ S.toast = txt; render(); }
function render(){
  let h;
  if(S.bozzaScheda) h = vistaConferma();
  else if(S.avvio === "auto") h = vistaProfilo(true);
  else if(S.avvio === "import") h = vistaImporta();
  else if(S.avvio === "home" || !S.profilo || !S.scheda) h = vistaHome();
  else if(S.tab === "oggi") h = vistaOggi();
  else if(S.tab === "progressi") h = vistaProgressi();
  else h = vistaProfilo(false);
  if(S.profilo && S.scheda && !S.bozzaScheda && !S.avvio){
    if(S.timer) h += '<div class="timer"><div><div class="tiny" style="color:#9FAAB3">Recupero</div>' +
      '<div class="num" id="tick">' + mmss(S.timer.left) + "</div></div>" +
      '<div style="display:flex;gap:8px"><button data-timeradd="30">+30 s</button><button data-timerstop="1">Chiudi</button></div></div>';
    h += '<nav class="nav">' + [["oggi","Allenamento"],["progressi","Progressi"],["profilo","Profilo"]].map(([k, t]) =>
      '<button data-tab="' + k + '" aria-current="' + (S.tab === k) + '"><span class="ic">' + ICONE[k] + "</span>" + t + "</button>").join("") + "</nav>";
  }
  if(S.modale === "proposta") h += modaleProposta();
  else if(S.modale === "conferma") h += modaleConferma();
  else if(S.modale === "check") h += modaleCheck();
  else if(S.modale === "recupero") h += modaleRecupero();
  if(S.toast){ h = '<div class="toast" id="toast" role="status">' + esc(S.toast) + "</div>" + h; S.toast = null; }
  $("#app").innerHTML = h;
  const tt = $("#toast");
  if(tt) setTimeout(() => { try{ tt.remove(); }catch(e){} }, 4500);
  tavoleEsercizi();
  caricaFoto();
  window.scrollTo(0, S.scroll || 0); S.scroll = 0;
}
const oggiISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
/* durata a parole: sotto il minuto si dicono i secondi */
function durata(s){
  s = Math.max(0, Math.round(s));
  if(s < 60) return s + " secondi";
  const m = Math.floor(s / 60), r = s % 60;
  if(!r) return m + (m === 1 ? " minuto" : " minuti");
  return m + " min " + r + " s";
}

function tavoleEsercizi(){
  document.querySelectorAll("img.tavola-img").forEach(im => {
    const dis = im.parentNode.querySelector(".tavola-dis");
    im.onload = () => { im.style.display = "block"; };
    im.onerror = () => { im.style.display = "none"; if(dis) dis.style.display = ""; };
    if(im.complete){ if(im.naturalWidth > 0) im.style.display = "block"; else { if(dis) dis.style.display = ""; } }
  });
}

async function caricaFoto(){
  for(const im of document.querySelectorAll("img[data-src]")){
    try{ const r = await store.get(im.dataset.src); if(r && r.value) im.src = r.value; }
    catch(e){ im.alt = "Foto non caricata"; }
  }
  for(const vd of document.querySelectorAll("video[data-vsrc]")){
    try{ const r = await store.get(vd.dataset.vsrc); if(r && r.value) vd.src = r.value; }
    catch(e){}
  }
}

document.addEventListener("click", async function(ev){
  const t = ev.target.closest("button"); if(!t) return;
  const d = t.dataset;

  if(d.campo){
    const p = S.profilo || {genere:"uomo", obiettivo:"ipertrofia", esperienza:"principiante", giorni:3, attrezzatura:"palestra"};
    p[d.campo] = isNaN(d.val) || d.val === "" ? d.val : Number(d.val);
    leggiForm(p); S.profilo = p; render(); return;
  }
  if(t.id === "salva-profilo"){
    const p = S.profilo || {genere:"uomo", obiettivo:"ipertrofia", esperienza:"principiante", giorni:3, attrezzatura:"palestra"};
    leggiForm(p); if(!p.nome) p.nome = "atleta";
    S.profilo = p; S.scheda = generaScheda(p);
    if(p.peso && !S.pesi.length) S.pesi.push({ts:Date.now(), kg:Number(p.peso)});
    S.avvio = null; S.tab = "oggi"; S.msg = "Scheda pronta: " + S.scheda.nome + ".";
    await salva(); render(); return;
  }
  if(d.gg !== undefined){
    const i = Number(d.gg), a = S.promemoria.giorni, j = a.indexOf(i);
    j >= 0 ? a.splice(j, 1) : a.push(i);
    S.promemoria.ora = ($("#f-ora") || {}).value || S.promemoria.ora;
    await salva(); render(); return;
  }
  if(t.id === "ics"){
    S.promemoria.ora = $("#f-ora").value || S.promemoria.ora;
    if(!S.promemoria.giorni.length){ avvisa("Scegli almeno un giorno."); return; }
    await salva(); scarica("olympvs-allenamento.ics", ics(), "text/calendar;charset=utf-8"); return;
  }
  if(t.id === "notifica"){
    const el = $("#stato-notifiche");
    try{
      const p = await Notification.requestPermission();
      S.promemoria.attivo = p === "granted";
      el.textContent = p === "granted" ? "Avvisi attivi, ma solo con l'app aperta. Per averli sempre serve la versione Android." : "Avvisi non concessi. Usa il calendario.";
      await salva(); pianificaAvvisi();
    }catch(e){ el.textContent = "Questo browser non supporta gli avvisi. Usa il calendario."; }
    return;
  }
  if(t.id === "export"){
    const d2 = {}; Object.keys(VUOTO()).forEach(k => d2[k] = S[k]);
    scarica("olympvs-backup-" + new Date().toISOString().slice(0, 10) + ".json", JSON.stringify(d2, null, 1), "application/json");
    return;
  }
  if(t.id === "reset"){
    if(!S.confReset){ S.confReset = true; avvisa("Tocca di nuovo Cancella tutto per confermare."); return; }
    S.confReset = false;
    for(const f of S.foto){ try{ await store.delete(f.key); }catch(e){} }
    for(const kk in S.video){ const v = S.video[kk]; if(v.tipo === "locale"){ try{ await store.delete(v.key); }catch(e){} } }
    try{ await store.delete(K); }catch(e){}
    S = Object.assign(VUOTO(), {tab:"oggi", giornoAperto:null, exAperto:null, bozza:{}, sostituz:{}, timer:null, msg:null, subProgressi:"peso", scambiaPer:null, fatti:{}});
    render(); return;
  }
  if(t.id === "scarico-ok"){ S.scaricoFatto.push(settimana() - (S.scaricoRimandato || 0)); S.msg = "Bene. Settimana leggera, torni forte dopo."; await salva(); render(); return; }
  if(t.id === "scarico-rinvia"){ S.scaricoRimandato = (S.scaricoRimandato || 0) + 1; await salva(); render(); return; }

  if(d.sub){ S.subProgressi = d.sub; render(); return; }
  if(d.tab){ S.tab = d.tab; S.avvio = null; S.giornoAperto = null; S.msg = null; tieniAcceso(false); render(); return; }
  if(d.giorno !== undefined){
    const nuovo = Number(d.giorno);
    /* rientrare nello stesso allenamento di oggi conserva quello che hai gia' scritto;
       passare a un altro, o tornarci domani, riparte pulito */
    if(!(S.fattiData === oggiISO() && S.fattiGiorno === nuovo)){
      S.bozza = {}; S.sostituz = {}; S.fatti = {}; S.fattiData = null; S.fattiGiorno = null; copiaSerie = {};
    }
    S.giornoAperto = nuovo; S.exAperto = null; S.msg = null; tieniAcceso(true); render(); return;
  }
  if(t.id === "indietro"){ S.giornoAperto = null; tieniAcceso(false); render(); return; }
  /* un pannello alla volta: aprirne uno chiude gli altri due */
  if(d.apri){ S.exAperto = S.exAperto === d.apri ? null : d.apri; S.scambiaPer = null; S.videoAperto = null; S.scroll = 0; render(); return; }
  if(d.ytdir !== undefined){
    S.ytDiretto = d.ytdir === "1";  /* non piu' usato: il video si guarda sempre dentro l'app */
    S.ytKey = (($("#f-ytkey") || {}).value || S.ytKey || "").trim();
    await salva(); render(); return;
  }
  if(t.id === "rev-ora"){ S.revisione = proponiRevisione(); S.modale = "conferma"; render(); return; }
  if(t.id === "rev-no"){ S.ultimaRevisione = Date.now(); S.modale = null; await salva(); avvisa("Va bene, ne riparliamo tra un mese."); return; }
  if(t.id === "rev-vai"){ S.revisione = proponiRevisione(); S.modale = "conferma"; render(); return; }
  if(t.id === "rev-chiudi"){ S.ultimaRevisione = Date.now(); S.modale = null; S.revisione = null; await salva(); render(); return; }
  if(t.id === "rev-annulla"){ S.ultimaRevisione = Date.now(); S.modale = null; S.revisione = null; await salva(); avvisa("Niente cambiato. La scheda resta questa."); return; }
  if(t.id === "rev-salva"){
    applicaRevisione(S.revisione);
    const n = S.revisione.cambi.length + S.revisione.note.length;
    S.modale = null; S.revisione = null;
    await salva();
    avvisa("Scheda aggiornata: " + n + (n === 1 ? " modifica salvata." : " modifiche salvate."));

    if(d.via === "dashboard"){ S.avvio = "home"; S.giornoAperto = null; render(); return; }
    if(d.via === "home"){ S.avvio = S.profilo && S.scheda ? "home" : null; S.bozzaScheda = null; S.importInfo = null; render(); return; }
    if(d.via === "manuale"){
      S.avvio = "manuale";
      S.bozzaScheda = {giorni:[{nome:"Allenamento 1", ex:[{nome:"", id:null, sets:3, rmin:8, rmax:12, peso:0}]}]};
      S.importInfo = null; render(); return;
    }
    if(d.via === "backup"){
      S.avvio = "import"; render();
      avvisa("Apri \u201cCarica un file\u201d e scegli il file di backup .json.");
      return;
    }
  }
  if(t.id === "salva-ytkey"){
    S.ytKey = (($("#f-ytkey") || {}).value || "").trim();
    await salva();
    avvisa(S.ytKey ? "Chiave salvata. Ora posso cercare i video." : "Chiave rimossa.");

  if(d.cercavid){

      if(S.videoTolti) delete S.videoTolti[d.cercavid];
      S.scroll = window.scrollY; await salva(); render();
    }catch(e){ avvisa("Ricerca non riuscita: " + (e.message || "controlla la chiave")); }
    return;
  }
  if(t.id === "trova-tutti"){
    const st = $("#stato-video");
    const mancanti = Object.keys(EX).filter(k => !S.video[k]);
    if(!mancanti.length){ avvisa("Hanno già tutti il video."); return; }
    let fatti = 0;
    for(const k of mancanti){
      if(st) st.textContent = "Cerco " + EX[k].n + "… (" + (fatti + 1) + " di " + mancanti.length + ")";
      try{
        const id = await trovaVideo(k);
        if(id){ S.video[k] = {tipo:"yt", id}; fatti++; }
      }catch(e){
        if(st) st.textContent = "Interrotto: " + (e.message || "errore");
        await salva(); return;
      }
    }
    await salva();
    avvisa("Trovati " + fatti + " video su " + mancanti.length + ".");

  }
  if(d.pick){
    const el = document.getElementById(d.pick);

    else avvisa("Campo non trovato. Riprova a riaprire la schermata.");
    return;
  }
  if(t.id === "manuale"){
    S.bozzaScheda = {giorni:[{nome:"Allenamento 1", ex:[{nome:"", id:null, sets:3, rmin:8, rmax:12, peso:0}]}]};
    S.importInfo = null; render(); return;
  }
  if(t.id === "imptesto-go"){
    const txt = ($("#imptesto") || {}).value || "";
    if(txt.trim().length < 5){ $("#stato-import").textContent = "Incolla prima il testo della scheda."; return; }
    const r = analizza(txt);
    if(!r.giorni.length){ $("#stato-import").textContent = "Non ho trovato esercizi. Serve almeno una riga tipo: Panca piana 4x8 60kg"; return; }
    S.bozzaScheda = {giorni:r.giorni}; S.importInfo = {nome:"testo incollato", lette:r.lette};
    render(); return;
  }
  if(d.split){
    leggiBozza();
    const [gi, ei] = d.split.split(":").map(Number);
    const g = S.bozzaScheda.giorni[gi];
    const resto = g.ex.splice(ei);
    S.bozzaScheda.giorni.splice(gi + 1, 0, {nome:"Allenamento " + (S.bozzaScheda.giorni.length + 1), ex:resto});
    S.scroll = window.scrollY; render(); return;
  }
  if(d.addex){
    leggiBozza();
    S.bozzaScheda.giorni[+d.addex].ex.push({nome:"", id:null, sets:3, rmin:8, rmax:12, peso:0});
    S.scroll = window.scrollY; render(); return;
  }
  if(d.delex){
    leggiBozza();
    const [gi, ei] = d.delex.split(":").map(Number);
    S.bozzaScheda.giorni[gi].ex.splice(ei, 1);
    S.scroll = window.scrollY; render(); return;
  }
  if(d.delday){
    leggiBozza();
    if(S.bozzaScheda.giorni.length < 2){ avvisa("Serve almeno un giorno."); return; }
    S.bozzaScheda.giorni.splice(+d.delday, 1);
    S.scroll = window.scrollY; render(); return;
  }
  if(t.id === "addday"){
    leggiBozza();
    S.bozzaScheda.giorni.push({nome:"Allenamento " + (S.bozzaScheda.giorni.length + 1), ex:[{nome:"", id:null, sets:3, rmin:8, rmax:12, peso:0}]});
    S.scroll = window.scrollY; render(); return;
  }
  if(t.id === "ricrea"){
    leggiBozza();
    S.bozzaScheda.giorni.forEach(g => g.ex = g.ex.filter(e => (e.nome || "").trim().length > 1));
    S.bozzaScheda.giorni = normalizzaBozza(S.bozzaScheda.giorni.filter(g => g.ex.length));
    S.msgBozza = "Riscritta: fondamentali per primi, intervalli di ripetizioni e recuperi sistemati.";
    S.scroll = 0; render(); return;
  }
  if(t.id === "annulla-scheda"){ S.bozzaScheda = null; S.importInfo = null; S.msgBozza = null; render(); return; }
  if(t.id === "conferma-scheda"){
    leggiBozza();
    S.bozzaScheda.giorni.forEach(g => g.ex = g.ex.filter(e => (e.nome || "").trim().length > 1));
    S.bozzaScheda.giorni = normalizzaBozza(S.bozzaScheda.giorni.filter(g => g.ex.length));
    if(!S.bozzaScheda.giorni.length){ avvisa("Non c'è ancora nessun esercizio con un nome."); render(); return; }
    if(!S.profilo) S.profilo = {nome:"atleta", genere:"altro", obiettivo:"ipertrofia", esperienza:"intermedio", giorni:S.bozzaScheda.giorni.length, attrezzatura:"palestra"};
    applicaBozza();
    S.bozzaScheda = null; S.importInfo = null; S.avvio = null; S.tab = "oggi";
    S.msg = "Scheda tua caricata: " + S.scheda.giorni.length + " allenamenti.";
    await salva(); render(); return;
  }
  if(d.scambia){ S.scroll = window.scrollY; S.scambiaPer = S.scambiaPer === d.scambia ? null : d.scambia;
    S.exAperto = null; S.videoAperto = null; render(); return; }
  if(d.video){ S.scroll = window.scrollY; S.videoAperto = S.videoAperto === d.video ? null : d.video;
    S.exAperto = null; S.scambiaPer = null; render(); return; }
  if(d.setyt){
    const campo = document.getElementById("vid-" + d.setyt), id = ytId(campo ? campo.value : "");
    if(!id){ avvisa("Non riconosco il link. Copialo dal pulsante Condividi di YouTube, tipo https://youtu.be/xxxxxxxxxxx"); return; }
    const vecchio = S.video[d.setyt];
    if(vecchio && vecchio.tipo === "locale"){ try{ await store.delete(vecchio.key); }catch(e){} }
    S.video[d.setyt] = {tipo:"yt", id};
    if(S.videoTolti) delete S.videoTolti[d.setyt];
    S.scroll = window.scrollY; await salva(); render(); return;
  }
  if(d.delvideo){
    const v = S.video[d.delvideo];
    if(v && v.tipo === "locale"){ try{ await store.delete(v.key); }catch(e){} }
    delete S.video[d.delvideo];
    S.videoTolti = S.videoTolti || {}; S.videoTolti[d.delvideo] = 1;
    S.scroll = window.scrollY; await salva(); render(); return;
  }
  if(d.usa){ const [k, id] = d.usa.split("|"); S.sostituz[k] = id; S.scambiaPer = null; S.scroll = window.scrollY;
    segnaGiornata(); await salva(); render(); return; }
  if(d.altro){
    const [k, modo] = d.altro.split("|"), [gi, ei] = k.split(":").map(Number);
    const campo = $("#alt-nome"), nome = ((campo && campo.value) || "").trim();
    if(nome.length < 3){ avvisa("Scrivi il nome dell'esercizio."); return; }
    const v = S.scheda.giorni[gi].ex[ei], orig = EX[v.id] || {g:"Gambe"};
    const id = idDaNome(nome, orig), ex2 = EX[id];
    if(modo === "sempre"){
      v.id = id; v.rmin = ex2.secondi ? 20 : v.rmin; v.rmax = ex2.secondi ? 60 : v.rmax;
      delete S.sostituz[k];
      S.msg = "Scheda aggiornata con " + ex2.n + ".";
    } else S.sostituz[k] = id;
    S.scambiaPer = null; S.scroll = window.scrollY;
    segnaGiornata(); await salva(); render(); return;
  }
  if(d.usasempre){
    const [k, id] = d.usasempre.split("|"), [gi, ei] = k.split(":").map(Number);
    const v = S.scheda.giorni[gi].ex[ei], ex = EX[id], iso = !ex.comp;
    v.id = id; v.rmin = ex.secondi ? 20 : v.rmin; v.rmax = ex.secondi ? 60 : v.rmax;
    delete S.sostituz[k]; S.scambiaPer = null; S.scroll = window.scrollY;
    S.msg = "Scheda aggiornata con " + ex.n + ".";
    await salva(); render(); return;
  }
  if(d.su){ const [gi, ei] = d.su.split(":").map(Number); aumenta(gi, ei); return; }
  if(d.salvaex){
    const [gi, ei] = d.salvaex.split(":").map(Number), e = exCorrente(gi, ei);
    /* bastano le ripetizioni: il peso vuoto o a zero vale zero, non invalida la serie */
    const bz = (S.bozza[d.salvaex] || []).filter(x => x && x.r !== undefined && String(x.r).trim() !== "" && Number(x.r) > 0);
    if(!bz.length){ avvisa("Scrivi almeno le ripetizioni di una serie."); return; }
    S.log.push({ts:Date.now(), giorno:gi, exId:e.id, sets:bz.map(x => ({w:Number(x.w) || 0, r:Number(x.r) || 0}))});
    if(!inScarico()){
      const medio = bz.reduce((a, x) => a + (Number(x.w) || 0), 0) / bz.length;
      if(medio > 0) S.carichi[e.id] = Math.round(medio * 2) / 2;
    }
    S.fatti = S.fatti || {}; S.fatti[d.salvaex] = 1; segnaGiornata();
    delete copiaSerie[d.salvaex];
    delete S.bozza[d.salvaex]; S.exAperto = null; S.scroll = window.scrollY;
    await salva(); render(); return;
  }
  if(t.id === "chiudi-sessione"){
    S.giornoAperto = null; S.exAperto = null; S.bozza = {}; S.sostituz = {}; S.fatti = {}; S.fattiData = null; S.fattiGiorno = null; copiaSerie = {};
    S.msg = "Allenamento registrato. I consigli sui carichi sono già aggiornati.";
    tieniAcceso(false); render(); return;
  }
  if(t.id === "add-peso"){
    const v = Number(($("#f-peso-new").value || "").replace(",", "."));
    if(!v || v < 25 || v > 300){ avvisa("Scrivi un peso valido, per esempio 76,5"); return; }
    S.pesi.push({ts:Date.now(), kg:v}); S.profilo.peso = v; await salva(); render(); return;
  }
  if(t.id === "add-misure"){
    const m = {ts:Date.now()}; let uno = false;
    MIS.forEach(([k]) => { const v = Number(($("#m-" + k).value || "").replace(",", ".")); if(v > 0){ m[k] = v; uno = true; } });
    if(!uno){ avvisa("Scrivi almeno una misura."); return; }
    S.misure.push(m); await salva(); render(); return;
  }
  if(d.delfoto){
    if(S.delFoto !== d.delfoto){ S.delFoto = d.delfoto; avvisa("Tocca di nuovo la × per eliminare la foto."); return; }
    S.delFoto = null;
    try{ await store.delete(d.delfoto); }catch(e){}
    S.foto = S.foto.filter(f => f.key !== d.delfoto); await salva(); render(); return;
  }
  if(d.recupero){ S.recuperoSug = Number(d.recupero) || 90; S.modale = "recupero"; S.scroll = window.scrollY; render(); return; }
  if(t.id === "rec-no"){ S.modale = null; S.scroll = window.scrollY; render(); return; }
  if(t.id === "rec-ok"){
    const mi = Math.max(0, Math.min(20, Number(($("#rec-min") || {}).value) || 0));
    const se = Math.max(0, Math.min(59, Number(($("#rec-sec") || {}).value) || 0));
    const tot = mi * 60 + se;
    if(tot < 5){ avvisa("Scrivi almeno cinque secondi."); return; }
    S.modale = null; S.scroll = window.scrollY;
    avviaTimer(tot); return;
  }
  if(d.timer){ avviaTimer(Number(d.timer)); return; }
  if(d.timeradd){ if(S.timer){ S.timer.fine += 30000; S.timer.left += 30; } tick(); return; }
  if(d.timerstop){ stopTimer(); render(); return; }
});

/* cosa ha copiato la prima riga sulle altre: serve a capire quali righe
   sono ancora copie e quali l'utente ha corretto a mano */
let copiaSerie = {}, attesaSalva = null;
function segnaGiornata(){ S.fattiData = oggiISO(); S.fattiGiorno = S.giornoAperto; }
function salvaFraPoco(){ clearTimeout(attesaSalva); attesaSalva = setTimeout(() => { salva(); }, 1200); }
function segnaRiga(inp, k, idx){
  const riga = inp.closest(".setline");
  if(!riga) return;
  const v = (S.bozza[k] || [])[idx] || {};
  const ok = Number(v.r) > 0;
  riga.classList.toggle("done", ok);
  const seg = riga.querySelector(".ok");
  if(seg) seg.textContent = ok ? "\u2713" : "";
}
document.addEventListener("input", async function(ev){
  const el = ev.target;
  if(el.dataset.set){
    const [gi, ei, i, campo] = el.dataset.set.split(":"), k = gi + ":" + ei;
    const idx = Number(i), val = el.value.replace(",", ".");
    S.bozza[k] = S.bozza[k] || [];
    S.bozza[k][idx] = S.bozza[k][idx] || {};
    S.bozza[k][idx][campo] = val;
    /* la prima riga fa da modello: riempie le righe ancora vuote e aggiorna
       quelle che sono rimaste una sua copia. Chi ha scritto a mano resta com'e'. */
    if(idx === 0){
      copiaSerie[k] = copiaSerie[k] || {};
      const prec = copiaSerie[k][campo];
      document.querySelectorAll('input[data-set^="' + k + ':"]').forEach(inp => {
        const q = inp.dataset.set.split(":"), j = Number(q[2]);
        if(j === 0 || q[3] !== campo) return;
        if(inp.value !== "" && !(prec !== undefined && inp.value === prec)) return;
        inp.value = val;
        S.bozza[k][j] = S.bozza[k][j] || {};
        S.bozza[k][j][campo] = val;
        segnaRiga(inp, k, j);
      });
      copiaSerie[k][campo] = val;
    }
    segnaRiga(el, k, idx);
    segnaGiornata(); salvaFraPoco();
    return;
  }
  if(el.id === "scatta" && el.files && el.files[0]){
    const f = el.files[0]; el.value = "";
    await aggiungiFoto(f); return;
  }
  if(el.id === "impfile" && el.files && el.files[0]){
    const f = el.files[0]; el.value = "";
    const st = $("#stato-import");
    if(st) st.textContent = "Leggo " + f.name + "…";
    if(/\.json$/i.test(f.name)){
      try{
        const dati = JSON.parse(await f.text());
        if(!dati.profilo && !dati.scheda) throw 0;
        Object.assign(S, dati); if(S.exCustom) Object.assign(EX, S.exCustom);
        await salva(); S.avvio = null; S.tab = "oggi"; S.msg = "Backup ripristinato.";
        render();
      }catch(e){ if(st) st.textContent = "Il file non sembra un backup dell'app."; }
      return;
    }
    try{
      const txt = await testoDaFile(f);
      const r = analizza(txt);
      if(!r.giorni.length){
        if(st) st.textContent = "Ho aperto il file ma non ho trovato esercizi riconoscibili. Prova a incollare il testo qui sotto.";
        return;
      }
      S.bozzaScheda = {giorni:r.giorni};
      S.importInfo = {nome:f.name, lette:r.lette};
      render();
    }catch(e){
      if(st) st.textContent = (e && e.message && e.message !== "rete") ? e.message :
        "Non sono riuscito ad aprire il file: se non c'è rete non posso leggere Excel, Word e PDF. Copia il testo e incollalo qui sotto.";
    }
    return;
  }
  if(el.classList.contains("vfile") && el.files && el.files[0]){
    const f = el.files[0], exId = el.dataset.ex; el.value = "";
    if(f.size > 3.2 * 1024 * 1024){
      avvisa("Video troppo pesante (" + Math.round(f.size / 104857.6) / 10 + " MB). Serve sotto i 3 MB: taglialo a dieci o quindici secondi, bastano.");
      return;
    }
    const fr = new FileReader();
    fr.onload = async () => {
      const key = "olympvs:video:" + exId;
      try{
        await store.set(key, fr.result);
        const v = S.video[exId];
        if(v && v.tipo === "locale" && v.key !== key){ try{ await store.delete(v.key); }catch(e){} }
        S.video[exId] = {tipo:"locale", key};
        await salva();
      }catch(e){ avvisa("Non sono riuscito a salvare il video: prova con uno più corto."); }
      S.scroll = window.scrollY; render();
    };
    fr.readAsDataURL(f);
    return;
  }
  if(el.id === "import" && el.files && el.files[0]){
    const f = el.files[0]; el.value = "";
    try{
      const testo = await f.text(), dati = JSON.parse(testo);
      if(!dati.profilo) throw 0;
      Object.assign(S, dati); await salva();
      S.tab = "oggi"; S.msg = "Backup ripristinato."; render();
    }catch(e){ avvisa("Il file non sembra un backup dell'app."); }
  }
});

document.addEventListener("change", function(ev){
  if(ev.target.type === "file") ev.target.dispatchEvent(new Event("input", {bubbles:true}));
});

function aggiungiFoto(file){
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = async () => {
        const max = 760, s = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
        cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
        const key = "olympvs:foto:" + Date.now();
        try{
          await store.set(key, cv.toDataURL("image/jpeg", 0.62));
          S.foto.push({ts:Date.now(), key}); await salva();
        }catch(e){ avvisa("Non sono riuscito a salvare la foto."); }
        render(); res();
      };
      im.onerror = () => { avvisa("Immagine non leggibile."); res(); };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function leggiForm(p){
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  if(!document.getElementById("f-nome")) return;
  p.nome = g("f-nome");
  p.eta = Number(g("f-eta")) || p.eta;
  p.altezza = Number(g("f-alt")) || p.altezza;
  p.peso = Number(g("f-peso").replace(",", ".")) || p.peso;
  p.note = g("f-note");
}

/* timer */
let intv = null, audio = null;
/* la sveglia va preparata mentre il dito e' ancora sullo schermo:
   dopo, il browser non lascia piu' partire un suono da solo */
function preparaSuono(){
  try{
    if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if(audio.state === "suspended") audio.resume();
  }catch(e){ audio = null; }
}
function suonaFine(){
  if(navigator.vibrate) try{ navigator.vibrate([400, 180, 400, 180, 600]); }catch(e){}
  if(!audio) return;
  try{
    const t0 = audio.currentTime;
    for(let i = 0; i < 5; i++){
      const o = audio.createOscillator(), g = audio.createGain(), a = t0 + i * 0.42;
      o.type = "sine"; o.frequency.setValueAtTime(i % 2 ? 1046 : 784, a);
      g.gain.setValueAtTime(0.0001, a);
      g.gain.exponentialRampToValueAtTime(0.6, a + 0.02);
      g.gain.setValueAtTime(0.6, a + 0.2);
      g.gain.exponentialRampToValueAtTime(0.0001, a + 0.34);
      o.connect(g); g.connect(audio.destination);
      o.start(a); o.stop(a + 0.36);
    }
  }catch(e){}
}
function avviaTimer(sec){
  preparaSuono();
  /* si segna l'istante di scadenza: se il telefono rallenta gli intervalli
     mentre lo schermo e' spento, il conto resta giusto lo stesso */
  S.timer = {fine: Date.now() + sec * 1000, left: sec};
  clearInterval(intv);
  intv = setInterval(() => {
    if(!S.timer) return clearInterval(intv);
    S.timer.left = Math.round((S.timer.fine - Date.now()) / 1000);
    if(S.timer.left <= 0){
      clearInterval(intv);
      suonaFine();
      S.timer = null; render(); return;
    }
    tick();
  }, 250);
  render();
}
function tick(){ const el = $("#tick"); if(el && S.timer) el.textContent = mmss(Math.max(0, S.timer.left)); }
function stopTimer(){ clearInterval(intv); S.timer = null; }

/* avvisi mentre l'app è aperta */
let avviso = null;
function pianificaAvvisi(){
  clearTimeout(avviso);
  if(!S.promemoria.attivo || typeof Notification === "undefined" || Notification.permission !== "granted") return;
  const [h, m] = S.promemoria.ora.split(":").map(Number);
  const ora = new Date(), t = new Date();
  t.setHours(h, m, 0, 0);
  if(t <= ora) t.setDate(t.getDate() + 1);
  if(S.promemoria.giorni.indexOf(t.getDay()) < 0) return;
  const ms = t - ora;
  if(ms < 2147483647) avviso = setTimeout(() => {
    try{ new Notification("È l'ora dell'allenamento", {body:"Il tempio ti aspetta, guerriero."}); }catch(e){}
    pianificaAvvisi();
  }, ms);
}

document.addEventListener("visibilitychange", () => { if(!document.hidden && S.giornoAperto !== null) tieniAcceso(true); });

  }
  try{ pianificaAvvisi(); }catch(e){}
