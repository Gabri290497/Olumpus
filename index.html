<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0E12">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OLYMPVS">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>OLYMPVS</title>
<style>html,body{margin:0;padding:0;background:#10151A;-webkit-text-size-adjust:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --marmo:#10151A; --lastra:#19212A; --notte:#EBE5D6; --soft:#93A0AC;
    --linea:#2C3743; --pece:#0A0E12; --egeo:#5E9CC9; --oro:#C9A44C; --oro-c:#E2C37B;
    --porfido:#D4594B; --alloro:#79A87F; --mare:#4FA7AA;
    --disp:"Cinzel",Georgia,"Times New Roman",serif;
    --body:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
  }

  /* copertina con il ritratto del dio */
  .heroDio{position:relative;overflow:hidden;padding:18px 16px 0;
    background:linear-gradient(135deg,#0E1D30 0%,#15283F 52%,#0A1424 100%)}
  .heroDio>img{position:absolute;right:-4%;top:0;height:100%;width:50%;object-fit:cover;object-position:50% 20%;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 42%);mask-image:linear-gradient(90deg,transparent,#000 42%)}
  .heroDio .testo{position:relative;z-index:2;padding-bottom:15px;max-width:60%}
  .heroDio .greca{position:relative;z-index:2}
  .heroDio h1{font-family:var(--disp);font-size:31px;line-height:1.04;letter-spacing:.03em;color:var(--oro-c);
    text-shadow:0 2px 12px rgba(0,0,0,.7)}
  .heroDio .claim{font-family:var(--disp);font-size:15px;color:#D7E0E9;margin-top:5px}
  .heroDio .sotto{font-size:13px;color:#A9B6C3;margin-top:7px;line-height:1.35}
  .heroDio .btn.link{padding-left:0}
  /* titolo di sezione con filetti d'oro */
  .sezione{display:flex;align-items:center;gap:11px;margin:18px 0 13px}
  .sezione b{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.13em;text-transform:uppercase;
    color:#CBD5DF;white-space:nowrap}
  .sezione i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--oro))}
  .sezione i+b+i{background:linear-gradient(90deg,var(--oro),transparent)}
  /* scheda di un allenamento */
  .dioCard{display:flex;width:100%;text-align:left;padding:0;margin:0 0 12px;cursor:pointer;color:inherit;font:inherit;
    border:1px solid var(--linea);border-radius:16px;overflow:hidden;
    background:linear-gradient(135deg,#142640,#0C1727)}
  .dioCard>img{width:112px;flex:0 0 112px;object-fit:cover;object-position:50% 18%}
  .dioCard .dati{flex:1;min-width:0;padding:12px 4px 12px 14px}
  .dioCard .nome{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:.04em;line-height:1.05;
    text-transform:uppercase;color:var(--notte)}
  .dioCard .ep{font-family:var(--disp);font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--oro-c);margin:4px 0 9px;padding-bottom:8px;border-bottom:1px solid rgba(201,164,76,.42)}
  .dioCard .riga{display:flex;align-items:center;gap:9px;font-size:13px;color:#BCC7D2;margin-top:6px;line-height:1.3}
  .dioCard .riga svg{flex:0 0 17px;color:var(--oro)}
  .dioCard .frec{align-self:center;padding:0 13px 0 6px;color:var(--oro);font-size:25px;line-height:1}
  /* riquadro del contatore */
  .statoCard{display:flex;align-items:center;gap:15px;border:1px solid rgba(201,164,76,.45);border-radius:14px;
    padding:13px 15px;background:rgba(201,164,76,.07);margin-top:16px}
  .statoCard .n{font-family:var(--disp);font-size:29px;color:var(--oro-c);line-height:1}
  .statoCard .sep{width:1px;align-self:stretch;background:rgba(201,164,76,.35)}
  /* scheda di un esercizio */
  .exCard{border:1px solid var(--linea);border-radius:16px;overflow:hidden;margin-bottom:13px;
    background:linear-gradient(135deg,#142640,#0C1727)}
  .exCard.ok{border-color:rgba(121,168,127,.6)}
  .exCard .testa{display:flex}
  .exCard .testa>img{width:104px;flex:0 0 104px;object-fit:cover;object-position:50% 18%}
  .exCard .corpo{flex:1;min-width:0;padding:12px 13px}
  .exCard .tit{display:flex;gap:10px;align-items:flex-start}
  .exCard .tit h3{flex:1;margin:0;font-size:19px;line-height:1.2}
  .exCard .serie{font-family:var(--disp);font-weight:700;font-size:18px;color:var(--oro-c);white-space:nowrap}
  .exCard .piede{padding:0 13px 13px}
  .exBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .exBtns .largo{grid-column:1/-1}
  .exBtns .btn{width:100%;justify-content:center}
  .spunta{color:#79A87F;font-size:17px;line-height:1;margin-right:5px}
  .stelle{font-size:12.5px;letter-spacing:1.5px;color:var(--oro);white-space:nowrap}
  .stelle i{color:#3D4654;font-style:normal}
  .exOpen{margin:0 0 13px;padding:12px 13px;border:1px solid var(--linea);border-radius:16px;
    background:linear-gradient(135deg,#142640,#0C1727)}
  #app{font-family:var(--body);color:var(--notte);background:var(--marmo);max-width:540px;margin:0 auto;
    min-height:100%;padding:0 0 96px;line-height:1.45;-webkit-font-smoothing:antialiased}
  #app h1,#app h2{font-family:var(--disp);font-weight:700;margin:0;letter-spacing:.01em}
  #app h1{font-size:29px;line-height:1.08}
  #app h2{font-size:18px}
  #app h3{font-family:var(--body);font-weight:600;font-size:16px;margin:0}
  #app p{margin:.4em 0}
  .num{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums}
  .wrap{padding:18px 16px}
  .muted{color:var(--soft);font-size:14px}
  .tiny{font-size:12.5px;color:var(--soft)}
  .epiteto{font-family:var(--disp);font-weight:500;font-size:13px;letter-spacing:.06em}

  .tempio{background:var(--pece);color:#F2F1EC;padding:22px 16px 0;position:relative}
  .tempio h1{color:#fff}
  .tempio .muted{color:#B2BAC1}
  .greca{display:block;width:100%;height:13px;margin-top:16px;opacity:.85}
  .glifo{position:absolute;right:12px;top:16px;opacity:.28}

  .card{background:var(--lastra);border:1px solid var(--linea);padding:16px;margin:12px 0}
  .card.flat{padding:0;overflow:hidden}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .filo{height:2px;background:var(--oro);width:34px;margin:10px 0}

  label{display:block;font-size:13.5px;font-weight:600;margin:16px 0 6px}
  input[type=text],input[type=number],input[type=time],textarea,select{width:100%;font:inherit;font-size:16px;
    padding:11px 12px;border:1px solid var(--linea);background:#131C24;color:var(--notte);border-radius:2px}
  input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2.5px solid var(--egeo);outline-offset:1px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{font:inherit;font-size:14px;padding:9px 13px;cursor:pointer;border:1px solid var(--linea);background:#131C24;color:var(--notte);border-radius:2px}
  .chip[aria-pressed=true]{background:var(--oro);border-color:var(--oro);color:#10151A}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .btn{font:inherit;font-weight:600;font-size:15.5px;padding:13px 16px;border:1px solid var(--oro);
    background:var(--oro);color:#10151A;cursor:pointer;width:100%;border-radius:2px}
  .btn.ghost{background:transparent;color:var(--notte);border-color:var(--linea)}
  .btn.oro{background:var(--oro);border-color:var(--oro);color:#10151A}
  .btn.small{width:auto;padding:9px 13px;font-size:14px}
  .btn.link{background:none;border:none;color:var(--oro-c);text-decoration:underline;width:auto;padding:6px 0;font-size:14px}

  .day{display:flex;width:100%;text-align:left;font:inherit;border:0;border-bottom:1px solid var(--linea);
    background:var(--lastra);cursor:pointer;padding:0;align-items:stretch}
  .day:last-child{border-bottom:none}
  .day .tab{width:8px;flex:none}
  .day .body{padding:14px 16px;flex:1}
  .day .dio{font-family:var(--disp);font-weight:700;font-size:19px}

  .ex{border-bottom:1px solid var(--linea);padding:14px 16px;background:var(--lastra)}
  .ex:last-child{border-bottom:none}
  .target{font-family:var(--disp);font-weight:700;font-size:15px;white-space:nowrap}
  .setline{display:grid;grid-template-columns:24px 1fr 12px 1fr 34px;gap:8px;align-items:center;margin-top:8px}
  .setline .i{font-family:var(--disp);font-weight:700;color:var(--soft);font-size:14px}
  .setline .x{text-align:center;color:var(--soft)}
  .setline input{padding:9px 6px;text-align:center;font-variant-numeric:tabular-nums}
  .setline .ok{text-align:center;font-size:17px;color:var(--alloro)}
  .done input{background:#16261C;border-color:#2F5A3A}

  .plates{display:flex;align-items:center;gap:3px;margin:10px 0 2px;flex-wrap:wrap}
  .plate{width:15px;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:flex-end;
    justify-content:center;padding-bottom:2px;font-family:var(--disp)}
  .barleft{width:24px;height:6px;background:#9AA4AA}

  .flag{padding:13px 15px;margin:12px 0;border:1px solid;display:flex;gap:11px;align-items:flex-start;font-size:14px}
  .flag.su{background:#152318;border-color:#31563A}
  .flag.giu{background:#251E12;border-color:#5B4A26}
  .flag.info{background:#141E28;border-color:#2B4054}
  .flag .dot{width:10px;height:10px;flex:none;margin-top:5px}

  .warm{background:#131C24;border:1px dashed var(--linea);padding:10px 12px;margin-top:10px;font-size:13.5px}
  .warm b{font-family:var(--disp)}

  .nav{position:fixed;bottom:0;left:0;right:0;background:var(--pece);border-top:1px solid var(--linea);
    display:flex;max-width:540px;margin:0 auto;z-index:20}
  .nav button{flex:1;background:none;border:none;padding:10px 2px 14px;font:inherit;font-size:11.5px;color:var(--soft);cursor:pointer}
  .nav button[aria-current=true]{color:var(--oro-c);font-weight:600;box-shadow:inset 0 3px 0 var(--oro)}
  .nav .ic{display:block;height:21px;margin-bottom:2px}

  .timer{position:fixed;bottom:78px;left:0;right:0;max-width:540px;margin:0 auto;background:var(--pece);
    color:#fff;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;z-index:19}
  .timer .num{font-size:23px;color:var(--oro-c)}
  .timer button{background:none;border:1px solid #66727C;color:#fff;padding:7px 11px;font:inherit;font-size:14px;cursor:pointer;border-radius:2px}

  .player{width:100%;aspect-ratio:16/9;background:#000;margin-top:10px;border-radius:10px;overflow:hidden}
  .player.vuoto{display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;
    background:linear-gradient(135deg,#142640,#0C1727);border:1px solid var(--linea)}
  .player.vuoto p{margin:7px 0 11px;font-size:14px;color:#BCC7D2;line-height:1.35}
  .player .vplay{font-size:25px;color:var(--oro);line-height:1}
  .player iframe,.player video{width:100%;height:100%;border:0;display:block}
  input[type=file]{width:100%;font:inherit;font-size:13.5px;padding:10px;border:1px dashed var(--linea);background:#131C24;color:var(--notte);border-radius:2px}
  .velo{position:fixed;inset:0;background:rgba(0,0,0,.74);z-index:70;display:flex;align-items:flex-end;
    justify-content:center;padding:16px;overflow-y:auto}
  .vignetta{background:var(--lastra);border:1px solid var(--linea);max-width:508px;width:100%;padding:16px;
    position:relative;margin-top:auto;box-shadow:0 -6px 24px rgba(0,0,0,.25)}
  .fumetto{background:#1E2831;border:2px solid var(--oro);color:var(--notte);border-radius:16px;padding:14px 16px;position:relative;margin-bottom:10px}
  .fumetto:after{content:"";position:absolute;left:38px;bottom:-13px;border:7px solid transparent;border-top-color:var(--oro)}
  .fumetto h2{font-size:19px;margin-bottom:6px}
  .fumetto p{font-size:14.5px}
  .parlante{position:absolute;right:14px;bottom:68px}
  .vignetta .azioni{display:flex;flex-direction:column;gap:8px;max-width:62%}
  ul.cambi{list-style:none;padding:0;margin:10px 0 0;font-size:14px}
  ul.cambi li{padding:7px 0 7px 20px;border-top:1px dotted var(--linea);position:relative}
  ul.cambi li:before{position:absolute;left:0;top:7px;font-weight:700}
  ul.cambi li.piu:before{content:"↑";color:var(--alloro)}
  ul.cambi li.meno:before{content:"↓";color:var(--porfido)}
  ul.cambi li.neutro:before{content:"•";color:var(--egeo)}
  .cielo{position:relative;padding:30px 16px 0;text-align:center;min-height:172px;overflow:hidden}
  .cielo-testo{position:relative}
  .cielo-testo svg{margin-bottom:6px}
  .cielo h1{font-family:var(--disp);font-weight:700;font-size:38px;letter-spacing:.12em;color:#EBD49A;margin:0}
  .cielo p{font-family:var(--disp);font-size:12.5px;letter-spacing:.14em;color:#B79A5E;margin:5px 0 0}
  .scelta{display:flex;gap:14px;align-items:center;background:var(--lastra);border:1px solid var(--linea);padding:14px;margin:14px 0}
  .scelta.destra{flex-direction:row-reverse;text-align:right}
  .scelta .figura{flex:0 0 84px}
  .pantheon{display:flex;gap:4px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch}
  .pantheon figure{margin:0;flex:0 0 66px;text-align:center}
  .pantheon figcaption{margin-top:2px}
  .toast{position:fixed;top:0;left:0;right:0;max-width:540px;margin:0 auto;z-index:60;background:var(--pece);
    color:#fff;padding:13px 16px;font-size:14.5px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .hist{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px dotted var(--linea)}
  .chart{width:100%;height:150px;display:block}
  .foto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .foto figure{margin:0;position:relative}
  .foto img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--linea);display:block}
  .foto figcaption{font-size:11px;color:var(--soft);padding-top:3px}
  .foto button{position:absolute;top:4px;right:4px;background:rgba(25,34,44,.82);color:#fff;border:0;
    width:22px;height:22px;font-size:13px;cursor:pointer;line-height:1}
  .seg{display:flex;border:1px solid var(--linea);background:#131C24;margin:14px 0}
  .seg button{flex:1;border:0;background:none;font:inherit;font-size:13.5px;padding:10px 4px;cursor:pointer;color:var(--soft)}
  .seg button[aria-pressed=true]{background:var(--oro);color:#10151A;font-weight:600}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"><div class="wrap"><p class="muted">Apro le porte del tempio…</p></div></div>

<script>
(function(){
"use strict";

/* archivio dati: dentro Claude usa il suo, fuori quello del browser */
var store = (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") ? window.storage : {
  get: async k => { const v = localStorage.getItem(k); if(v === null) throw new Error("assente"); return {key:k, value:v}; },
  set: async (k, v) => { localStorage.setItem(k, v); return {key:k, value:v}; },
  delete: async k => { localStorage.removeItem(k); return {key:k, deleted:true}; },
  list: async p => ({keys: Object.keys(localStorage).filter(k => !p || k.indexOf(p) === 0)})
};


/* ============================================================
   1. ESERCIZI
   ============================================================ */
const EX = {
  panca:{n:"Panca piana con bilanciere",g:"Petto",att:"bilanciere",comp:1,inc:2.5,casa:0,cue:["Scapole strette e schiacciate sulla panca, piedi ben piantati","Scendi in 2 secondi fino a sfiorare il petto, senza rimbalzare","Polsi dritti sopra i gomiti, gomiti a circa 45 gradi dal busto"]},
  pancaincl:{n:"Panca inclinata con manubri",g:"Petto",att:"manubri",comp:1,inc:2,casa:1,cue:["Schienale a 30 gradi, non di più: oltre lavora solo la spalla","Manubri all'altezza del petto alto, palmi leggermente ruotati","Ferma un secondo in basso, poi spingi senza far sbattere i manubri"]},
  chestpress:{n:"Chest press alla macchina",g:"Petto",att:"macchina",comp:1,inc:2.5,casa:0,cue:["Regola il sedile: le maniglie all'altezza della metà del petto","Non bloccare del tutto i gomiti a fine spinta","Schiena appoggiata, spalle mai staccate dallo schienale"]},
  croci:{n:"Croci ai cavi",g:"Petto",att:"cavi",comp:0,inc:2.5,casa:0,cue:["Gomiti morbidi e fissi per tutto il movimento","Immagina di abbracciare un albero, non di spingere","Ferma mezzo secondo quando le mani si incontrano"]},
  piegamenti:{n:"Piegamenti sulle braccia",g:"Petto",att:"corpo libero",comp:1,inc:0,casa:1,cue:["Corpo in linea: testa, bacino e talloni sulla stessa riga","Mani poco più larghe delle spalle, gomiti a 45 gradi","Se è troppo facile, appoggia i piedi su una sedia"]},
  dip:{n:"Dip alle parallele",g:"Petto",att:"corpo libero",comp:1,inc:0,casa:0,cue:["Busto leggermente in avanti per caricare il petto","Scendi finché le spalle arrivano all'altezza dei gomiti","Se non riesci, usa l'elastico o la macchina assistita"]},
  stacco:{n:"Stacco da terra",g:"Schiena",att:"bilanciere",comp:1,inc:5,casa:0,cue:["Bilanciere attaccato alle tibie, schiena dritta e petto alto","Parti spingendo i piedi nel pavimento, non tirando con le braccia","Chiudi con i glutei, senza inarcare la schiena all'indietro"]},
  rematore:{n:"Rematore con bilanciere",g:"Schiena",att:"bilanciere",comp:1,inc:2.5,casa:0,cue:["Busto a circa 45 gradi, schiena piatta per tutta la serie","Tira verso l'ombelico, gomiti stretti al corpo","Niente slancio: se ti serve, togli peso"]},
  lat:{n:"Lat machine avanti",g:"Schiena",att:"macchina",comp:1,inc:2.5,casa:0,cue:["Presa poco più larga delle spalle","Abbassa le scapole prima di piegare i gomiti","Tira la sbarra al petto alto, mai dietro la nuca"]},
  trazioni:{n:"Trazioni alla sbarra",g:"Schiena",att:"corpo libero",comp:1,inc:0,casa:1,cue:["Parti da braccia distese ma spalle attive, non appeso morto","Pensa a portare i gomiti verso i fianchi","Metti un elastico sotto i piedi se non arrivi alle ripetizioni"]},
  pulley:{n:"Pulley basso",g:"Schiena",att:"cavi",comp:1,inc:2.5,casa:0,cue:["Busto quasi fermo, non dondolare avanti e indietro","Tira all'ombelico e stringi le scapole un secondo","Ritorno lento e controllato in tre secondi"]},
  remmanubrio:{n:"Rematore con manubrio",g:"Schiena",att:"manubri",comp:1,inc:2,casa:1,cue:["Una mano e un ginocchio sulla panca, schiena parallela al suolo","Tira il manubrio verso l'anca, non verso la spalla","Non ruotare il busto per aiutarti"]},
  remorizz:{n:"Rematore orizzontale al tavolo",g:"Schiena",att:"corpo libero",comp:1,inc:0,casa:1,cue:["Sotto un tavolo solido o una sbarra bassa, corpo teso in linea","Tira il petto verso il bordo stringendo le scapole","Più avvicini i piedi al corpo, più diventa facile"]},
  pullover:{n:"Pullover con manubrio",g:"Schiena",att:"manubri",comp:0,inc:2,casa:1,cue:["Sdraiato, manubrio sopra il petto tenuto con entrambe le mani","Porta le braccia dietro la testa con i gomiti quasi fermi","Fermati quando senti allungare il dorsale, non oltre"]},
  facepull:{n:"Face pull ai cavi",g:"Schiena",att:"cavi",comp:0,inc:2.5,casa:0,cue:["Cavo all'altezza del viso, presa con la corda","Tira verso la fronte aprendo i gomiti larghi","Peso leggero: qui conta la salute delle spalle"]},
  squat:{n:"Squat con bilanciere",g:"Gambe",att:"bilanciere",comp:1,inc:5,casa:0,cue:["Bilanciere appoggiato sui trapezi, mai sul collo","Scendi finché le cosce sono parallele o poco sotto","Ginocchia in linea con le punte dei piedi, mai verso l'interno"]},
  squatgoblet:{n:"Goblet squat con manubrio",g:"Gambe",att:"manubri",comp:1,inc:2,casa:1,cue:["Manubrio verticale appoggiato al petto, gomiti dentro","Scendi tra le ginocchia tenendo il petto alto","Talloni sempre a terra: se si alzano, apri di più i piedi"]},
  bulgaro:{n:"Affondo bulgaro",g:"Gambe",att:"manubri",comp:1,inc:2,casa:1,cue:["Piede posteriore su una sedia o panca bassa","Il peso resta sulla gamba davanti, non spingere con quella dietro","Busto leggermente in avanti per caricare il gluteo"]},
  pressa:{n:"Pressa per gambe",g:"Gambe",att:"macchina",comp:1,inc:5,casa:0,cue:["Piedi a larghezza spalle a metà pedana","Scendi fino a 90 gradi al ginocchio senza staccare la schiena","Non bloccare le ginocchia in estensione"]},
  affondi:{n:"Affondi con manubri",g:"Gambe",att:"manubri",comp:1,inc:2,casa:1,cue:["Passo lungo, busto eretto","Ginocchio posteriore che sfiora il pavimento","Spingi con il tallone della gamba davanti per risalire"]},
  stepup:{n:"Step up su rialzo",g:"Gambe",att:"manubri",comp:1,inc:2,casa:1,cue:["Rialzo all'altezza del ginocchio, appoggio stabile","Sali spingendo solo con la gamba che sta sopra","Scendi lentamente, non saltare giù"]},
  rumeno:{n:"Stacco rumeno con bilanciere",g:"Gambe",att:"bilanciere",comp:1,inc:2.5,casa:0,cue:["Gambe quasi tese, ginocchia morbide","Manda indietro il bacino, il bilanciere scivola sulle cosce","Fermati quando senti tirare dietro la coscia, non a terra"]},
  rumenoman:{n:"Stacco rumeno con manubri",g:"Gambe",att:"manubri",comp:1,inc:2,casa:1,cue:["Manubri vicini alle cosce per tutta la discesa","Manda indietro il bacino, schiena sempre dritta","Scendi finché senti tirare dietro la coscia, poi risali"]},
  ponteglutei:{n:"Ponte per glutei",g:"Gambe",att:"corpo libero",comp:0,inc:0,casa:1,cue:["Schiena a terra, talloni vicini al sedere","Spingi con i talloni e stringi i glutei due secondi in alto","Se diventa facile, appoggia un manubrio sul bacino"]},
  legext:{n:"Leg extension",g:"Gambe",att:"macchina",comp:0,inc:2.5,casa:0,cue:["Schienale regolato: ginocchio allineato al perno","Estendi e stringi il quadricipite un secondo in alto","Discesa lenta, non far sbattere i pesi"]},
  legcurl:{n:"Leg curl",g:"Gambe",att:"macchina",comp:0,inc:2.5,casa:0,cue:["Bacino appoggiato, non staccarlo per aiutarti","Piega lentamente e ferma in massima contrazione","Torna controllato senza lasciar cadere il peso"]},
  hipthrust:{n:"Hip thrust",g:"Gambe",att:"bilanciere",comp:1,inc:5,casa:0,cue:["Scapole sul bordo della panca, mento verso il petto","Spingi con i talloni e chiudi i glutei in alto","Sale il bacino, non le costole: niente inarcamenti"]},
  polpacci:{n:"Calf raise in piedi",g:"Gambe",att:"macchina",comp:0,inc:2.5,casa:1,cue:["Scendi lentamente fino al massimo allungamento","Sali sulle punte e ferma un secondo in alto","Niente rimbalzi: lento in entrambe le direzioni"]},
  military:{n:"Lento avanti con bilanciere",g:"Spalle",att:"bilanciere",comp:1,inc:2.5,casa:0,cue:["Presa poco più larga delle spalle, gomiti sotto i polsi","Stringi glutei e addome per non inarcare la schiena","Sposta la testa indietro mentre il bilanciere sale"]},
  spallemanubri:{n:"Lento avanti con manubri",g:"Spalle",att:"manubri",comp:1,inc:2,casa:1,cue:["Seduto con schienale alto se hai problemi di schiena","Non far sbattere i manubri in alto","Scendi fino ad avere i gomiti a 90 gradi"]},
  alzate:{n:"Alzate laterali",g:"Spalle",att:"manubri",comp:0,inc:1,casa:1,cue:["Peso leggero: questo esercizio si controlla, non si spinge","Sali fino all'altezza delle spalle, non oltre","Gomiti leggermente più alti dei polsi"]},
  alzateposteriori:{n:"Alzate posteriori",g:"Spalle",att:"manubri",comp:0,inc:1,casa:1,cue:["Busto piegato in avanti o petto appoggiato alla panca inclinata","Apri le braccia larghe, pollici verso l'esterno","Un secondo di fermo in massima apertura"]},
  curlbil:{n:"Curl con bilanciere",g:"Braccia",att:"bilanciere",comp:0,inc:2.5,casa:0,cue:["Gomiti fermi ai fianchi per tutta la serie","Niente slancio del busto","Scendi fino a braccia quasi distese"]},
  curlman:{n:"Curl con manubri",g:"Braccia",att:"manubri",comp:0,inc:1,casa:1,cue:["Ruota il polso verso l'esterno mentre sali","Spalle ferme e basse","Alterna le braccia se ti aiuta a controllare meglio"]},
  hammer:{n:"Hammer curl",g:"Braccia",att:"manubri",comp:0,inc:1,casa:1,cue:["Palmi che si guardano per tutto il movimento","Gomiti incollati al busto","Discesa in tre secondi"]},
  pushdown:{n:"Push down ai cavi",g:"Braccia",att:"cavi",comp:0,inc:2.5,casa:0,cue:["Gomiti fissi ai fianchi: si muovono solo gli avambracci","Estendi del tutto e stringi il tricipite","Busto leggermente in avanti e fermo"]},
  french:{n:"French press con manubri",g:"Braccia",att:"manubri",comp:0,inc:1,casa:1,cue:["Gomiti stretti e puntati verso l'alto","Scendi lentamente dietro la testa","Non aprire i gomiti quando risali"]},
  dippanca:{n:"Dip tra due panche",g:"Braccia",att:"corpo libero",comp:0,inc:0,casa:1,cue:["Mani sul bordo della panca, dita in avanti","Scendi fino a gomiti a 90 gradi, non oltre","Spalle basse, mai incassate nel collo"]},
  plank:{n:"Plank",g:"Core",att:"corpo libero",comp:0,inc:0,casa:1,secondi:1,cue:["Gomiti sotto le spalle, corpo in linea retta","Stringi glutei e addome, bacino né alto né basso","Respira normalmente, non trattenere il fiato"]},
  crunchinv:{n:"Crunch inverso",g:"Core",att:"corpo libero",comp:0,inc:0,casa:1,cue:["Porta le ginocchia al petto arrotolando il bacino","Movimento lento, senza slancio","Schiena bassa sempre a contatto col pavimento"]},
  hollow:{n:"Hollow hold",g:"Core",att:"corpo libero",comp:0,inc:0,casa:1,secondi:1,cue:["Schiena bassa schiacciata a terra: è la regola principale","Braccia e gambe distese, più sono basse più è difficile","Se la schiena si stacca, piega le ginocchia"]},
  pancadecl:{n:"Panca declinata con bilanciere",g:"Petto",att:"bilanciere",comp:1,inc:2.5,casa:0,cue:["Panca inclinata verso il basso di 15-20 gradi, gambe bloccate","Scendi al petto basso, gomiti più stretti che nella piana","Fatti dare il bilanciere: da soli lo stacco è scomodo"]},
  spintepiane:{n:"Distensioni su panca con manubri",g:"Petto",att:"manubri",comp:1,inc:2,casa:1,cue:["Manubri all'altezza del petto, polsi sopra i gomiti","Scendi più in basso che col bilanciere, sfruttando l'allungamento","In alto non farli sbattere: lascia un dito di spazio"]},
  crocipanca:{n:"Croci su panca con manubri",g:"Petto",att:"manubri",comp:0,inc:1,casa:1,cue:["Gomiti morbidi e bloccati in quell'angolo per tutta la serie","Apri fino a sentire tirare il petto, non oltre","Carico leggero: qui si allunga, non si spinge"]},
  pecdeck:{n:"Pectoral machine",g:"Petto",att:"macchina",comp:0,inc:2.5,casa:0,cue:["Regola il sedile: le maniglie all'altezza delle spalle","Schiena appoggiata, spalle basse","Chiudi e ferma un secondo, poi torna lento"]},
  piegdiamante:{n:"Piegamenti a presa stretta",g:"Petto",att:"corpo libero",comp:1,inc:0,casa:1,cue:["Mani sotto il petto, indici e pollici che si toccano","Gomiti stretti al busto durante la discesa","Corpo in linea: niente bacino che cede"]},
  lativersa:{n:"Lat machine presa inversa",g:"Schiena",att:"macchina",comp:1,inc:2.5,casa:0,cue:["Palmi verso di te, presa a larghezza spalle","Porta i gomiti verso i fianchi, non indietro","Petto in fuori per tutta la tirata"]},
  tbar:{n:"Rematore T-bar",g:"Schiena",att:"bilanciere",comp:1,inc:2.5,casa:0,cue:["Busto a 45 gradi, schiena piatta","Tira all'ombelico stringendo le scapole","Non alzarti col busto per tirare più peso"]},
  remmacchina:{n:"Rematore alla macchina",g:"Schiena",att:"macchina",comp:1,inc:2.5,casa:0,cue:["Petto appoggiato al cuscino, spalle rilassate all'inizio","Tira portando i gomiti dietro il busto","Ritorno lento, senza lasciare andare il peso"]},
  iperest:{n:"Iperestensioni lombari",g:"Schiena",att:"macchina",comp:0,inc:2.5,casa:0,cue:["Bacino sopra il cuscino, non la pancia","Scendi controllato e risali fino alla linea del corpo","Non inarcare oltre: ci si ferma dritti"]},
  shrug:{n:"Scrollate con manubri",g:"Schiena",att:"manubri",comp:0,inc:2,casa:1,cue:["Solo le spalle salgono, dritte verso le orecchie","Niente rotazioni: non servono e infastidiscono il collo","Ferma un secondo in alto, scendi lento"]},
  goodmorning:{n:"Good morning",g:"Schiena",att:"bilanciere",comp:1,inc:2.5,casa:0,cue:["Bilanciere sui trapezi, ginocchia morbide","Manda indietro il bacino tenendo la schiena piatta","Carico leggero: è un esercizio tecnico, non di forza bruta"]},
  pulldowncorda:{n:"Pulldown a braccia tese",g:"Schiena",att:"cavi",comp:0,inc:2.5,casa:0,cue:["Braccia quasi tese per tutto il movimento","Spingi la corda verso le cosce usando il dorso","Busto fermo, si muovono solo le braccia"]},
  squatfrontale:{n:"Squat frontale",g:"Gambe",att:"bilanciere",comp:1,inc:2.5,casa:0,cue:["Bilanciere sui deltoidi anteriori, gomiti alti","Busto più verticale rispetto allo squat classico","Se i gomiti cadono il bilanciere scivola: tienili su"]},
  hacksquat:{n:"Hack squat alla macchina",g:"Gambe",att:"macchina",comp:1,inc:5,casa:0,cue:["Schiena e bacino sempre attaccati allo schienale","Piedi a metà pedana, larghezza spalle","Scendi almeno fino al parallelo"]},
  affondicamm:{n:"Affondi in camminata",g:"Gambe",att:"manubri",comp:1,inc:2,casa:1,cue:["Passo lungo, busto eretto","Il ginocchio dietro sfiora il pavimento","Spingi col tallone davanti per avanzare"]},
  abduttori:{n:"Macchina abduttori",g:"Gambe",att:"macchina",comp:0,inc:2.5,casa:0,cue:["Schiena appoggiata, busto fermo","Apri le gambe lentamente e ferma un secondo","Chiudi controllando, non far sbattere i pesi"]},
  adduttori:{n:"Macchina adduttori",g:"Gambe",att:"macchina",comp:0,inc:2.5,casa:0,cue:["Parti da un'apertura che senti ma non tira","Chiudi le gambe stringendo l'interno coscia","Ritorno lento e controllato"]},
  nordic:{n:"Nordic curl",g:"Gambe",att:"corpo libero",comp:0,inc:0,casa:1,cue:["Caviglie bloccate, corpo in linea dalle ginocchia alla testa","Scendi il più lentamente possibile trattenendo","Le mani ti salvano a terra: usale per risalire"]},
  sissy:{n:"Sissy squat",g:"Gambe",att:"corpo libero",comp:0,inc:0,casa:1,cue:["Talloni alzati, ginocchia che vanno avanti","Corpo in linea dalle ginocchia alla testa","Tieniti a un supporto finché non hai equilibrio"]},
  polpaccised:{n:"Calf raise da seduto",g:"Gambe",att:"macchina",comp:0,inc:2.5,casa:0,cue:["Cuscino sulle cosce vicino alle ginocchia","Scendi fino al massimo allungamento","Sali sulle punte e ferma due secondi"]},
  kickback:{n:"Slanci per glutei ai cavi",g:"Gambe",att:"cavi",comp:0,inc:2.5,casa:0,cue:["Busto leggermente avanti, mani sul supporto","Porta indietro la gamba stringendo il gluteo","Non inarcare la schiena per salire di più"]},
  arnold:{n:"Arnold press",g:"Spalle",att:"manubri",comp:1,inc:2,casa:1,cue:["Parti coi palmi verso di te, ruota mentre spingi","In alto i palmi guardano avanti","Movimento fluido, senza strappi"]},
  alzatefront:{n:"Alzate frontali",g:"Spalle",att:"manubri",comp:0,inc:1,casa:1,cue:["Sali fino all'altezza degli occhi, non oltre","Niente slancio del busto","Una mano alla volta se controlli meglio"]},
  tirmento:{n:"Tirate al mento",g:"Spalle",att:"bilanciere",comp:1,inc:2.5,casa:0,cue:["Presa poco più larga delle spalle: stretta infastidisce","Tira fino allo sterno, gomiti alti","Se senti pizzicare la spalla, fermati prima"]},
  spallemacchina:{n:"Shoulder press alla macchina",g:"Spalle",att:"macchina",comp:1,inc:2.5,casa:0,cue:["Sedile regolato: maniglie all'altezza delle spalle","Schiena appoggiata, addome contratto","Non bloccare i gomiti in alto"]},
  pecdeckinv:{n:"Pectoral machine inversa",g:"Spalle",att:"macchina",comp:0,inc:2.5,casa:0,cue:["Petto appoggiato, braccia quasi tese","Apri portando i gomiti indietro e larghi","Peso leggero: questi muscoli sono piccoli"]},
  scott:{n:"Curl alla panca Scott",g:"Braccia",att:"bilanciere",comp:0,inc:2.5,casa:0,cue:["Ascelle appoggiate al cuscino","Scendi fino a braccia quasi tese, controllando","Bilanciere sagomato se i gomiti danno fastidio"]},
  curlcavo:{n:"Curl ai cavi",g:"Braccia",att:"cavi",comp:0,inc:2.5,casa:0,cue:["Gomiti fermi ai fianchi","Tensione costante: il cavo non molla mai","Ritorno lento fino all'allungamento"]},
  concentrato:{n:"Curl concentrato",g:"Braccia",att:"manubri",comp:0,inc:1,casa:1,cue:["Seduto, gomito appoggiato all'interno coscia","Sali stringendo, ferma un secondo in alto","Niente slanci: il braccio resta incollato"]},
  kickbacktri:{n:"Kickback per tricipiti",g:"Braccia",att:"manubri",comp:0,inc:1,casa:1,cue:["Busto piegato, braccio parallelo al terreno","Si muove solo l'avambraccio","Estendi del tutto e ferma un secondo"]},
  pancastretta:{n:"Panca a presa stretta",g:"Braccia",att:"bilanciere",comp:1,inc:2.5,casa:0,cue:["Mani a larghezza spalle, non più strette","Gomiti stretti al busto","Scendi allo sterno, non al collo"]},
  curlpolsi:{n:"Curl ai polsi",g:"Braccia",att:"manubri",comp:0,inc:1,casa:1,cue:["Avambracci appoggiati alle cosce o alla panca","Fai scendere il manubrio fino alle dita, poi arrotola","Movimento corto e lento, peso basso"]},
  crunch:{n:"Crunch a terra",g:"Core",att:"corpo libero",comp:0,inc:0,casa:1,cue:["Stacca solo le scapole, non tutta la schiena","Mani alle tempie senza tirare il collo","Espira mentre sali"]},
  planklat:{n:"Plank laterale",g:"Core",att:"corpo libero",comp:0,inc:0,casa:1,secondi:1,cue:["Gomito sotto la spalla, corpo in linea","Bacino alto, non lasciarlo cadere","Se è troppo, appoggia il ginocchio a terra"]},
  mountain:{n:"Mountain climber",g:"Core",att:"corpo libero",comp:0,inc:0,casa:1,secondi:1,cue:["Mani sotto le spalle, corpo in linea","Porta le ginocchia al petto alternando","Bacino fermo: non deve rimbalzare su e giù"]},
  abwheel:{n:"Ruota per addominali",g:"Core",att:"corpo libero",comp:0,inc:0,casa:1,cue:["Parti in ginocchio, addome contratto","Rotola avanti solo finché la schiena resta neutra","Se la schiena si inarca sei andato troppo avanti"]},
  legraise:{n:"Sollevamento gambe alla sbarra",g:"Core",att:"corpo libero",comp:0,inc:0,casa:1,cue:["Appeso, spalle attive","Arrotola il bacino mentre sali, non solo le gambe","Niente dondolio: scendi controllato"]},
  situp:{n:"Sit up",g:"Core",att:"corpo libero",comp:0,inc:0,casa:1,cue:["Piedi appoggiati, ginocchia piegate","Sali arrotolando la schiena una vertebra alla volta","Non tirare il collo con le mani"]},
  birddog:{n:"Bird dog",g:"Core",att:"corpo libero",comp:0,inc:0,casa:1,secondi:1,cue:["A quattro zampe, mani sotto le spalle","Allunga braccio e gamba opposti restando stabile","Il bacino non deve ruotare"]},
  tapis:{n:"Camminata in pendenza",g:"Cardio",att:"macchina",comp:1,inc:1,casa:0,cardio:1,cue:["Pendenza tra 8 e 12, velocità che ti permetta di parlare a fatica","Non aggrapparti alle maniglie: falsa tutto il lavoro","Passo lungo, appoggio dal tallone"]},
  corsa:{n:"Corsa continua",g:"Cardio",att:"corpo libero",comp:1,inc:1,casa:1,cardio:1,cue:["Ritmo costante: devi riuscire a dire una frase intera","Appoggio sotto il bacino, non davanti","Se il fiato manca rallenta, non fermarti di colpo"]},
  interval:{n:"Ripetute brevi",g:"Cardio",att:"corpo libero",comp:1,inc:1,casa:1,cardio:1,cue:["Trenta secondi forte e novanta di recupero, si ripete","Il forte è davvero forte, altrimenti non serve","Cinque minuti di riscaldamento prima, sempre"]},
  cyclette:{n:"Cyclette",g:"Cardio",att:"macchina",comp:1,inc:1,casa:1,cardio:1,cue:["Sella all'altezza dell'anca: la gamba si stende quasi del tutto","Resistenza tale da pedalare a 80-90 giri","Schiena dritta, non scaricare sulle braccia"]},
  ellittica:{n:"Ellittica",g:"Cardio",att:"macchina",comp:1,inc:1,casa:0,cardio:1,cue:["Spingi anche con le braccia, non lasciarle appoggiate","Tallone sempre in contatto con la pedana","Busto eretto, sguardo avanti"]},
  vogatore:{n:"Vogatore",g:"Cardio",att:"macchina",comp:1,inc:1,casa:0,cardio:1,cue:["Ordine giusto: prima gambe, poi busto, poi braccia","Ritorno al contrario: braccia, busto, gambe","Schiena mai curva: la forza parte dalle gambe"]},
  scalatore:{n:"Stair climber",g:"Cardio",att:"macchina",comp:1,inc:1,casa:0,cardio:1,cue:["Busto eretto, non appoggiarti al corrimano","Appoggia tutto il piede sul gradino","Ritmo costante, meglio lento e continuo"]},
  corda:{n:"Salto con la corda",g:"Cardio",att:"corpo libero",comp:1,inc:1,casa:1,cardio:1,cue:["Salti bassi, pochi centimetri da terra","Gira la corda con i polsi, non con le braccia","Atterra sull'avampiede, ginocchia morbide"]},
  burpee:{n:"Burpees",g:"Cardio",att:"corpo libero",comp:1,inc:1,casa:1,cardio:1,cue:["Scendi in appoggio, piegamento, risali e salta","Se è troppo togli il piegamento o il salto","Meglio pochi e puliti che tanti e scomposti"]},
  camminata:{n:"Camminata veloce",g:"Cardio",att:"corpo libero",comp:1,inc:1,casa:1,cardio:1,cue:["Passo svelto, braccia che accompagnano","Il respiro deve accelerare ma restare regolare","Va benissimo anche come recupero il giorno dopo le gambe"]},
  russian:{n:"Russian twist",g:"Core",att:"corpo libero",comp:0,inc:1,casa:1,cue:["Busto a 45 gradi, schiena dritta","Ruota dal torace, non solo con le braccia","Tocca ai lati senza appoggiare il peso"]}
};

function adatto(id, p){
  return (p.attrezzatura !== "casa" || EX[id].casa);
}
/* Quanto un esercizio puo' rimpiazzarne un altro, da una a cinque stelle.
   Pesa i muscoli in comune, poi lo schema di movimento, l'attrezzo e il fatto
   che siano entrambi fondamentali o entrambi di isolamento. */
function compatibilita(a, b){
  const A = EX[a] || {}, B = EX[b] || {};
  const ma = muscoli(a) || {p:[], s:[]}, mb = muscoli(b) || {p:[], s:[]};
  const tutti = m => (m.p || []).concat(m.s || []);
  const la = tutti(ma), lb = tutti(mb);
  const comuni = la.filter(x => lb.indexOf(x) >= 0).length;
  const unione = new Set(la.concat(lb)).size || 1;
  let q = 2.5 * (comuni / unione);
  const pa = ma.p || [], pb = mb.p || [];
  const princ = pa.filter(x => pb.indexOf(x) >= 0).length;
  if(pa.length && princ === pa.length) q += 1.1;
  else if(princ) q += 0.55;
  if(PATTERN[a] && PATTERN[a] === PATTERN[b]) q += 0.8;
  if(!!A.comp === !!B.comp) q += 0.4;
  if(A.att && A.att === B.att) q += 0.35;
  return Math.max(1, Math.min(5, Math.round(q)));
}
const stelle = n => '<span class="stelle" aria-label="Compatibilita\u0300 ' + n + ' su 5">' +
  "\u2605\u2605\u2605\u2605\u2605".slice(0, n) + "<i>" + "\u2605\u2605\u2605\u2605\u2605".slice(0, 5 - n) + "</i></span>";

/* nome scritto a mano: se lo riconosco aggancio quello che ho gia',
   altrimenti lo aggiungo agli esercizi tuoi tenendo gruppo e attrezzo dell'originale */
function idDaNome(nome, orig){
  const noto = riconosci(nome);
  if(noto && EX[noto]){
    /* aggancio solo se quello che hai scritto sta tutto dentro il nome che conosco:
       "panca piana" si', "affondi camminati" no, perche' camminati e' un altro esercizio */
    const tuoi = norm(nome).split(" ").filter(x => x.length > 3), suo = norm(EX[noto].n);
    if(tuoi.length && tuoi.every(x => suo.indexOf(x) >= 0)) return noto;
  }
  const base = "c-" + (norm(nome).replace(/ /g, "-").slice(0, 26) || "esercizio");
  if(!EX[base]){
    S.exCustom = S.exCustom || {};
    S.exCustom[base] = {n:nome.slice(0, 52), g:orig.g, att:orig.att || "da definire",
      comp:orig.comp, inc:orig.inc, casa:orig.casa, cardio:orig.cardio, secondi:orig.secondi, custom:1,
      cue:["Esercizio aggiunto da te al posto di " + orig.n + ".",
           "Controlla la tecnica con un video o con un istruttore.",
           "Se senti dolore articolare fermati e riduci il carico."]};
    EX[base] = S.exCustom[base];
  }
  return base;
}

function sostituisci(id0, p, usati){
  const okEsp = id => !(p.esperienza === "principiante" && RISCHIOSI[id]);
  const cand = [id0].concat(ALT[id0] || []);
  for(const id of cand) if(EX[id] && adatto(id, p) && okEsp(id) && !usati[id]) return id;
  for(const id of cand) if(EX[id] && adatto(id, p) && !usati[id]) return id;
  const g = EX[id0].g;
  for(const id in EX) if(EX[id].g === g && adatto(id, p) && okEsp(id) && !usati[id]) return id;
  for(const id in EX) if(EX[id].g === g && adatto(id, p) && !usati[id]) return id;
  return null;
}
const CARDIO_PAL_G = ["tapis","cyclette","vogatore","ellittica","scalatore"];
const CARDIO_CASA_G = ["camminata","corda","corsa","interval","burpee"];
function generaScheda(p){
  let chiave = p.giorni;
  if(p.giorni === 3 && p.esperienza !== "principiante") chiave = 3.5;
  const base = SPLIT[chiave] || SPLIT[3];
  const s = SCHEMI[p.obiettivo] || SCHEMI.ipertrofia;
  const giorni = base.g.map(g => {
    const visti = {}, ex = [];
    g.ex.forEach(id0 => {
      const id = sostituisci(id0, p, visti);
      if(!id) return;
      visti[id] = 1;
      const e = EX[id], iso = !e.comp;
      ex.push({
        id,
        sets: iso ? s.setsI : s.setsC,
        rmin: e.secondi ? 20 : (iso ? s.rmin + 4 : s.rmin),
        rmax: e.secondi ? 60 : (iso ? s.rmax + 3 : s.rmax),
        rest: iso ? s.restI : s.rest
      });
    });
    const quanti = p.obiettivo === "dimagrimento" ? 99 : p.obiettivo === "ricomposizione" ? 2 : 0;
    return {dio:g.dio, ex, cardio:quanti, indice:0};
  });
  giorni.forEach((g, i) => {
    if(!g.cardio) return;
    if(g.cardio !== 99 && i % 2) return;
    const lista = p.attrezzatura === "casa" ? CARDIO_CASA_G : CARDIO_PAL_G;
    const id = lista[i % lista.length];
    g.ex.push({id, sets:1, rmin: p.obiettivo === "dimagrimento" ? 20 : 15,
      rmax: p.obiettivo === "dimagrimento" ? 35 : 25, rest:0});
    delete g.cardio; delete g.indice;
  });
  giorni.forEach(g => { delete g.cardio; delete g.indice; });
  return {nome:base.nome, inizio:Date.now(), giorni};
}

const carico = id => S.carichi[id] || 0;
function sessioni(id){ return S.log.filter(l => l.exId === id); }

function consiglio(e){
  const st = sessioni(e.id), peso = carico(e.id);
  const car = !!EX[e.id].cardio, tempo = !!EX[e.id].secondi;
  const unita = car ? " minuti" : tempo ? " secondi" : " ripetizioni";
  if(!st.length) return {tipo:"nuovo", txt:"Prima volta. Scegli un carico con cui chiudi " + e.rmin +
    unita + (car ? " a ritmo costante, senza finire distrutto." : " pulite lasciandone due nel serbatoio.")};
  const u = st[st.length - 1], serie = u.sets.filter(s => s.r > 0);
  if(!serie.length) return null;
  const inc = EX[e.id].inc;
  if(serie.length >= e.sets && serie.every(s => s.r >= e.rmax)){
    /* si cita il numero davvero registrato, non il massimo previsto:
       chi ha chiuso a venti non deve leggere diciotto */
    const fatte = Math.min.apply(null, serie.map(s => s.r));
    if(!inc) return {tipo:"su", inc:0, txt:"Tutte le serie chiuse a " + fatte + unita +
      ". Rendilo più difficile: discesa in quattro secondi, piedi su un rialzo o un peso addosso."};
    if(car) return {tipo:"su", inc:inc, txt:"Hai retto " + fatte + " minuti. Alza il livello a " +
      fmt(peso + inc) + " e riparti da " + e.rmin + " minuti."};
    return {tipo:"su", inc:inc, txt:"Tutte le serie chiuse a " + fatte + unita + ". Sali a " +
      fmt(peso + inc) + " kg e riparti da " + e.rmin + "."};
  }
  const scarsa = l => l.sets.filter(s => s.r > 0).every(s => s.r < e.rmin);
  if(st.length >= 2 && scarsa(u) && scarsa(st[st.length - 2]) && peso > 0)
    return {tipo:"giu", txt:"Due sessioni di fila sotto " + e.rmin + unita + ". Scendi a circa " +
      fmt(Math.round(peso * 0.9 * 2) / 2) + " kg e ricostruisci da lì."};
  return {tipo:"resta", txt:car ? "Resta su questo livello e aggiungi un paio di minuti rispetto alla volta scorsa."
    : "Resta " + (peso > 0 ? "a " + fmt(peso) + " kg " : "") + "e aggiungi " +
      (tempo ? "qualche secondo" : "una ripetizione") + " rispetto alla volta scorsa."};
}
function aumenta(gi, ei){
  const e = exCorrente(gi, ei), c = consiglio(e);
  if(c && c.tipo === "su" && c.inc){ S.carichi[e.id] = carico(e.id) + c.inc; S.msg = EX[e.id].n + ": ora " + fmt(carico(e.id)) + " kg."; }
  salva(); render();
}

function settimana(){ return Math.floor((Date.now() - S.scheda.inizio) / 6048e5) + 1; }
function ciclo(){ const e = S.profilo.esperienza; return e === "principiante" ? 8 : e === "intermedio" ? 7 : 6; }
function inScarico(){
  const w = settimana() - (S.scaricoRimandato || 0);
  return w > 0 && w % ciclo() === 0 && S.scaricoFatto.indexOf(w) < 0;
}
function riscaldamento(e){
  const p = carico(e.id);
  if(!EX[e.id].comp || p < 30) return null;
  const barra = EX[e.id].att === "bilanciere" ? 20 : 0;
  const arr = [[0.45, 8], [0.7, 5], [0.87, 3]].map(([q, r]) => {
    let kg = Math.round(p * q / 2.5) * 2.5;
    if(barra && kg < barra) kg = barra;
    return {kg, r};
  });
  return arr.filter((x, i) => i === 0 || x.kg > arr[i - 1].kg);
}

/* ============================================================
   5bis. MISURATORI E REVISIONE
   ============================================================ */
const GIORNO = 864e5;

function finestra(da, a){
  return S.log.filter(l => l.ts >= da && l.ts < a);
}
function volume(log){
  return log.reduce((t, l) => t + l.sets.reduce((a, s) => a + (EX[l.exId] && EX[l.exId].cardio ? (s.r || 0) * 5 : (s.w || 0) * (s.r || 0)), 0), 0);
}
function misuratori(giorni){
  const ora = Date.now(), d = (giorni || 14) * GIORNO;
  const ora1 = finestra(ora - d, ora), prima = finestra(ora - 2 * d, ora - d);
  const sess = n => new Set(n.map(l => new Date(l.ts).toDateString())).size;
  const attese = Math.round((S.profilo.giorni || 3) * (giorni || 14) / 7);
  const fatte = sess(ora1);
  const v1 = volume(ora1), v0 = volume(prima);
  const trend = v0 > 0 ? Math.round((v1 / v0 - 1) * 100) : (v1 > 0 ? 100 : 0);
  // quante serie chiuse al massimo del range
  let alMax = 0, totSerie = 0, sotto = 0;
  ora1.forEach(l => {
    const e = trovaEx(l.exId);
    if(!e) return;
    l.sets.forEach(s => {
      if(!s.r) return;
      totSerie++;
      if(s.r >= e.rmax) alMax++;
      if(s.r < e.rmin) sotto++;
    });
  });
  return {
    giorni: giorni || 14, sessioni:fatte, attese,
    aderenza: attese ? Math.round(fatte / attese * 100) : 0,
    volume:v1, volumePrima:v0, trend,
    saturazione: totSerie ? Math.round(alMax / totSerie * 100) : 0,
    sofferenza: totSerie ? Math.round(sotto / totSerie * 100) : 0,
    serie: totSerie
  };
}
function trovaEx(exId){
  if(S.scheda) for(const g of S.scheda.giorni) for(const e of g.ex) if(e.id === exId) return e;
  const ex = EX[exId];
  if(!ex) return null;
  if(ex.cardio) return {id:exId, rmin:20, rmax:35, sets:1};
  if(ex.secondi) return {id:exId, rmin:20, rmax:60, sets:3};
  return {id:exId, rmin:8, rmax:12, sets:3};
}
function consigliMisuratori(m){
  const out = [];
  if(!m.serie) return [{t:"neutro", txt:"Non ho abbastanza registrazioni negli ultimi " + m.giorni + " giorni. Segna le serie mentre ti alleni: è da lì che nascono i consigli."}];
  if(m.aderenza < 70){
    const sugg = Math.max(2, m.sessioni);
    out.push({t:"attenzione", txt:"Hai fatto " + m.sessioni + " allenamenti su " + m.attese + " previsti." +
      (sugg < (S.profilo.giorni || 3) ? " Una scheda da " + sugg + " giorni che fai davvero vale più di una da " + S.profilo.giorni + " che salti."
        : " Se è stata una settimana storta va bene, ma se si ripete conviene alleggerire.")});
  }
  else out.push({t:"bene", txt:"Costanza buona: " + m.sessioni + " allenamenti su " + m.attese + " previsti."});
  if(m.saturazione >= 45) out.push({t:"bene", txt:"Il " + m.saturazione + "% delle serie è chiuso al massimo delle ripetizioni. Sei pronto ad aumentare i carichi sugli esercizi che te lo segnalano in verde."});
  else if(m.saturazione <= 15 && m.sofferenza >= 30) out.push({t:"attenzione", txt:"Il " + m.sofferenza + "% delle serie finisce sotto il minimo: stai usando carichi troppo alti. Cala del 10% e ricostruisci."});
  else out.push({t:"neutro", txt:"Sei dentro il range di ripetizioni: aggiungi una ripetizione per serie prima di alzare il peso."});
  if(m.volumePrima > 0){
    if(m.trend >= 10) out.push({t:"bene", txt:"Il lavoro totale è cresciuto del " + m.trend + "% rispetto alle due settimane precedenti. Continua così."});
    else if(m.trend <= -10) out.push({t:"attenzione", txt:"Il lavoro totale è calato del " + Math.abs(m.trend) + "%. Se non è una settimana di scarico, controlla sonno e alimentazione prima di cambiare la scheda."});
    else out.push({t:"neutro", txt:"Lavoro totale stabile rispetto alle due settimane precedenti: va bene, purché i carichi salgano."});
  }
  const fermi = esercizioFermi(28);
  if(fermi.length) out.push({t:"attenzione", txt:"Fermi da almeno quattro sessioni: " + fermi.slice(0, 3).map(x => EX[x].n).join(", ") + ". Cambia esercizio o togli il 10% e risali."});
  return out;
}
function esercizioFermi(gg){
  const da = Date.now() - gg * GIORNO, out = [];
  const ids = Array.from(new Set(S.log.filter(l => l.ts >= da).map(l => l.exId)));
  ids.forEach(id => {
    const st = S.log.filter(l => l.exId === id && l.ts >= da);
    if(st.length < 4) return;
    const pesi = st.map(l => Math.max.apply(null, l.sets.map(s => s.w || 0)));
    if(Math.max.apply(null, pesi) <= Math.min.apply(null, pesi)) out.push(id);
  });
  return out;
}

/* --- proposta di revisione della scheda --- */
function proponiRevisione(){
  const m = misuratori(28), cambi = [], fermi = esercizioFermi(28);
  S.scheda.giorni.forEach((g, gi) => {
    g.ex.forEach((e, ei) => {
      const ex = EX[e.id];
      if(!ex) return;
      const st = S.log.filter(l => l.exId === e.id && l.ts >= Date.now() - 28 * GIORNO);
      const serie = st.reduce((a, l) => a.concat(l.sets.filter(s => s.r > 0)), []);
      if(!st.length){
        if(m.aderenza >= 50) cambi.push({gi, ei, tipo:"via", txt:EX[e.id].n + ": mai fatto nell'ultimo mese, lo tolgo"});
        return;
      }
      const max = serie.filter(s => s.r >= e.rmax).length / Math.max(1, serie.length);
      const giu = serie.filter(s => s.r < e.rmin).length / Math.max(1, serie.length);
      const pesi = st.map(l => Math.max.apply(null, l.sets.map(s => s.w || 0)));
      const cresciuto = pesi[pesi.length - 1] > pesi[0];
      if(max >= 0.6 && cresciuto && e.sets < 5 && ex.comp){
        cambi.push({gi, ei, tipo:"piu", campo:"sets", da:e.sets, a:e.sets + 1,
          txt:EX[e.id].n + ": vai forte, passo da " + e.sets + " a " + (e.sets + 1) + " serie"});
      } else if(max >= 0.6 && !ex.cardio){
        cambi.push({gi, ei, tipo:"piu", campo:"rmin", da:e.rmin, a:e.rmin + 2, a2:e.rmax + 2,
          txt:EX[e.id].n + ": alzo il range a " + (e.rmin + 2) + "-" + (e.rmax + 2) + " ripetizioni"});
      } else if(giu >= 0.5 && e.sets > 2){
        cambi.push({gi, ei, tipo:"meno", campo:"sets", da:e.sets, a:e.sets - 1,
          txt:EX[e.id].n + ": fatichi a chiudere, scendo da " + e.sets + " a " + (e.sets - 1) + " serie"});
      } else if(giu >= 0.5){
        cambi.push({gi, ei, tipo:"meno", campo:"peso", da:carico(e.id), a:Math.round(carico(e.id) * 0.9 * 2) / 2,
          txt:EX[e.id].n + ": tolgo il 10% del carico e si ricostruisce"});
      } else if(fermi.indexOf(e.id) >= 0 && carico(e.id) > 0){

function applicaRevisione(r){
  r.cambi.slice().sort((a, b) => b.ei - a.ei).forEach(c => {
    const g = S.scheda.giorni[c.gi];
    if(!g) return;
    if(c.tipo === "via"){ g.ex.splice(c.ei, 1); return; }
    const e = g.ex[c.ei];
    if(!e) return;
    if(c.campo === "sets") e.sets = c.a;
    else if(c.campo === "rmin"){ e.rmin = c.a; e.rmax = c.a2; }
    else if(c.campo === "peso") S.carichi[e.id] = c.a;
  });
  r.note.forEach(n => { if(n.tipo === "giorni") S.profilo.giorni = n.a; });

  S.scheda.rivista = (S.scheda.rivista || 0) + 1;
}
function serveRevisione(){
  if(!S.scheda || !S.log.length) return false;

}

}

   "lato" = profilo, "fronte" e "retro" = piano frontale. */
const VISTE = {

  pushup:["lato"], plank:["lato"], dip:["lato"], pressoVert:["fronte","lato"],
  tirataOrizz:["lato","retro"], tirataVert:["retro","lato"], curl:["fronte"],
  tricipiti:["lato","retro"], alzateLat:["fronte"], alzatePost:["lato","retro"],
  affondo:["lato"], legKnee:["lato"], ponte:["lato"], polpacci:["lato","retro"],
  crunch:["lato"], corsa:["lato"], bici:["lato"], voga:["lato"]
